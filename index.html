function baseRows(tipo){
  const cc=i=>CCS[i%CCS.length];
  if(tipo==="funcao") return Object.entries(FUNCOES).map(([id,f])=>({
    "Código":id,"Função":f.nome,"Classe salarial":f.classe.split(" ·")[0],
    "CBO":"7"+(100+id.length*37%800)+"-0"+(1+id.length%9),
    "Periculosidade":f.peric?"Sim":"Não","Insalubridade":f.insal?"Sim":"Não","Turno":f.turno?"Sim":"Não"}));
  if(tipo==="sindicato") return Object.entries(SINDICATOS).map(([id,s])=>({
    "Cód. sindicato":id,"Razão social":s.nome,"Unidade":s.unidade,
    "% INSS":s.inss,"% FGTS":s.fgts,"Fator horas extras":s.fatorHE.toLocaleString("pt-BR"),"Abono":s.abono?"Sim":"Não"}));
  if(tipo==="reajustes"){const st=Store.get();
    return Object.entries(SINDICATOS).map(([id,s])=>({
    "Cód. sindicato":id,"% reajuste 2027":st.ciclo.premissas.reajustes[id].toLocaleString("pt-BR"),
    "Data-base":"01/"+String(s.dataBase).padStart(2,"0")+"/2027","Abono":s.abono?"Sim":"Não"}));}
  if(tipo==="filiais") return Object.values(SINDICATOS).map((s,i)=>({
    "Estabelecimento":"0"+(i+1),"Unidade":s.unidade.split("-")[0].trim(),"UF":s.unidade.split("-")[1],
    "Chave unidade":"0"+(i+1)+"-"+s.unidade.split(" ")[1].slice(0,2).toUpperCase()}));
  if(tipo==="faixa") return Array.from({length:15},(_,i)=>{const base=1890*Math.pow(1.24,i);
    return {"Cód. tabela":i<8?"TAB-A":"TAB-B","Classe salarial":"C"+String((i+1)*10+40),
    "×0,65":fmtR(base*.65),"×0,8":fmtR(base*.8),"×1,0":fmtR(base),"×1,1":fmtR(base*1.1),"×1,2":fmtR(base*1.2)};});
  if(tipo==="quadro_vagas") return Array.from({length:23},(_,i)=>{const fs=Object.keys(FUNCOES);
    return {"Vaga":"V-2027-"+String(i+1).padStart(3,"0"),"Função · código":fs[i%fs.length],
    "Centro de custo":cc(i).id,"Motivo do aumento de quadro":["Expansão Mina Sul","Reposição","NR-22","Novo turno"][i%4],
    "E-mail da chefia":norm(cc(i).gestor.split(" ")[0])+"@aurora.example","Mês de início":MESES[(i*2)%12]+"/27"};});
  if(tipo==="horas_extras") return Array.from({length:96},(_,i)=>{const c=cc(i%8);
    return {"Centro de custo":c.id,"Competência":MESES[Math.floor(i/8)]+"/26",
    "Total realizado":fmtR(c.heMedia*(0.9+(i%5)*.05)),"Média realizado":fmtR(c.heMedia/Math.max(20,c.heMedia/4000)),
    "Qtd orçado":180+(i*13)%160};});
  /* --- 6ª rodada: bases de custo por pessoa e por centro de custo --- */
  if(tipo==="plano_saude"){
    const PLANOS=["Enfermaria nacional","Apartamento nacional","Enfermaria regional"];
    const vidaVal=f=>{const p=(Store.get().parametros||[]).find(x=>x.id==="vida_saude");
      return (p&&p.vals[f])||320;};
    return Array.from({length:220},(_,i)=>{const c=cc(i%8), m=10000+i*3;
      const fx=FAIXAS_ETARIAS[(i*3)%FAIXAS_ETARIAS.length], tit=i%3!==2;
      return {"Matrícula":String(m),"Vida":NOMES1[m%20]+" "+NOMES2[(m*7)%20],
        "Vínculo":tit?"Titular":"Dependente","Operadora":["Vida Sul","Unimed regional","Amil"][i%3],
        "Plano":PLANOS[i%3],"Faixa etária":fx,"Centro de custo":c.id,
        "Valor mensal":fmtR(vidaVal(fx)*(tit?1:0.85))};});}
  if(tipo==="beneficios_pessoa"){
    const VB=["reten","reconh","creche","escol","aluguel","vida","prev"];
    return Array.from({length:64},(_,i)=>{const m=10000+i*7, id=VB[i%VB.length];
      const v=VERBAS.find(x=>x.id===id);
      return {"Matrícula":String(m),"Verba":v.nome,"Elegível":"Sim",
        "Valor mensal":fmtR(((Store.get().verbas.valores[id])||1000)/(v.lateral?18:1)),
        "Mês de início":MESES[i%12]+"/27","Observação":i%9===0?"Acordo individual":""};});}
  if(tipo==="beneficios_cc"){
    const VB=["vr","cesta","vcomb","telem"];
    const RATEIO=["Headcount do mês","Rateio fixo","Vidas elegíveis","Headcount do mês"];
    return CCS.flatMap((c,ci)=>VB.map((id,vi)=>{const v=VERBAS.find(x=>x.id===id);
      return {"Centro de custo":c.id,"Verba":v.nome,"Critério de rateio":RATEIO[vi],
        "Valor mensal":fmtR((Store.get().verbas.valores[id]||100)*(c.oper?1:0.86)),
        "Reajuste (mês)":MESES[[4,4,6,6][vi]]+"/27"};}));}
  if(tipo==="custo_cr_conta") return CUSTO_CR_CONTA.map(l=>({
    "Centro de resultado":l.cr+" · "+(CRS.find(r=>r.id===l.cr)||{}).nome,
    "Conta contábil":l.gl+" · "+(CONTAS[l.gl]||""),
    "Verba genérica":(VERBAS.find(v=>v.id===l.verba)||{}).nome||l.verba,
    "Valor mensal":fmtR(l.mes),"Valor anual":fmtR(l.mes*12)}));
  if(tipo==="posicoes"){ /* uma posição por ocupante, com posição pai fechando na diretoria */
    const rows=[];let m=10000;
    for(const [ccid,func,q] of QUADRO){const c=CCS.find(x=>x.id===ccid);
      for(let i=0;i<q;i++){m++;
        rows.push({"ID da posição":posDoCC(ccid)+"-"+String(m),
          "Posição pai":posDoCC(ccid),
          "Título da posição":FUNCOES[func].nome,
          "Centro de custo":ccid,"Função · código":func,
          "Ocupante":NOMES1[m%20]+" "+NOMES2[(m*7)%20],
          "Situação":i%37===0?"Vaga aberta":"Ocupada"});}}
    /* as posições de chefia: cada CC pendura na sua diretoria */
    CCS.forEach(c=>rows.unshift({"ID da posição":posDoCC(c.id),"Posição pai":POS_DIR[c.dir],
      "Título da posição":"Gestão · "+c.nome,"Centro de custo":c.id,"Função · código":"GER-040",
      "Ocupante":c.gestor,"Situação":"Ocupada"}));
    Object.entries(DIRS).forEach(([k,d])=>rows.unshift({"ID da posição":POS_DIR[k],"Posição pai":"—",
      "Título da posição":d.nome,"Centro de custo":"—","Função · código":"GER-040",
      "Ocupante":d.dir,"Situação":"Ocupada"}));
    return rows;}
  /* quadro_pessoal: expande o QUADRO em colaboradores */
  const rows=[];let m=10000;
  for(const [ccid,func,q] of QUADRO){const f=FUNCOES[func],c=CCS.find(x=>x.id===ccid);
    for(let i=0;i<q;i++){m++;
      rows.push({"Matrícula":String(m),"Colaborador":NOMES1[m%20]+" "+NOMES2[(m*7)%20],
        "Função · código":func,"Centro de custo":ccid,"Sindicato · código":c.sind,
        "Data da admissão":String(1+(m%27)).padStart(2,"0")+"/"+String(1+(m%12)).padStart(2,"0")+"/20"+(15+(m%11)),
        "Atividade periculosa":f.peric?"Sim":"Não","Salário real":fmtR(f.sal+(m%7)*35)});}}
  return rows;
}

/* 6ª rodada · Férias em "provisão somente": o gestor não programa mês nenhum.
   As férias entram como provisão mensal linear, exatamente como o 13º — o caminho simples
   para a maioria dos gestores, que não acompanha vencimento. */
function vFeriasProvisao(wfd,cadeia){
  const st=Store.get(), P=st.ciclo.provisao;
  const linhas=MEU_QUADRO.map(e=>{
    const fer=P.ferias?e.sal*0.0833:0, terco=P.terco?e.sal*0.0278:0;
    return {e,fer,terco,enc:(fer+terco)*0.365,tot:(fer+terco)*1.365};});
  const tot=linhas.reduce((s,l)=>s+l.tot,0);
  return `<div class="page-head"><div><div class="eyebrow">Meu orçamento · sua área</div>
    <h1>${esc(wfd.nome)} — Beneficiamento</h1>
    <p>Este ciclo está configurado em <b>provisão somente</b>: não há programação de períodos.
      As férias provisionam linearmente todo mês, como o 13º. ${pin(1,"quadro")}</p></div>
    <div class="spacer"></div>${badge("Provisão somente","b-info")}
    <button class="btn" onclick="A.go('home')">${ic("back")} Portal</button></div>
  <div class="grid g4">
    ${kpi("Provisão mensal",fmtR(tot),"férias + 1/3 + encargos")}
    ${kpi("Provisão anual",fmtMil(tot*12),"na área de Beneficiamento")}
    ${kpi("Colaboradores",MEU_QUADRO.length,"na base do mês")}
    ${kpi("Componentes",[P.ferias&&"Férias",P.terco&&"1/3"].filter(Boolean).join(" + ")||"—","ligados na configuração")}
  </div>
  <div class="card" style="margin-top:14px"><div class="ch"><h3>Provisão calculada</h3><span class="spacer"></span>
    ${badge("somente leitura","b-neutral")}</div>
    <div class="cb tight"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>Colaborador</th><th class="num">Salário</th><th class="num">Férias (8,33%)</th>
      <th class="num">1/3 (2,78%)</th><th class="num">Encargos</th><th class="num">Provisão mensal</th></tr></thead>
    <tbody>${linhas.map(l=>`<tr><td class="ro">${esc(l.e.nome)}</td><td class="ro num">${fmtR(l.e.sal)}</td>
      <td class="ro num">${l.fer?fmtR(l.fer):"—"}</td><td class="ro num">${l.terco?fmtR(l.terco):"—"}</td>
      <td class="ro num">${fmtR(l.enc)}</td><td class="ro num"><b>${fmtR(l.tot)}</b></td></tr>`).join("")}</tbody>
    <tfoot><tr><td colspan="5">Total da área · ${MEU_QUADRO.length} colaboradores</td>
      <td class="num"><b>${fmtR(tot)}</b></td></tr></tfoot>
    </table></div></div></div>
  <div class="note" style="margin-top:12px">${ic("cog")}<span>Quem decide o modelo é o RH, na configuração do ciclo
    (<b>Fluxo → Premissas → Provisões e modelo de férias</b>). Trocar para <b>programação por período</b> devolve a grade
    de meses ao gestor, com data-base e vencimento por colaborador.
    ${st.papel==="rh"?`<button class="btn btn-sm" style="margin-left:8px" onclick="UI.cfgStep=1;A.go('config')">Abrir configuração</button>`:""}</span></div>`;
}

/* ---------- Preenchimento genérico por workflow (gestor) / acompanhamento (RH·CFO) ---------- */
function vWfFill(id){
  const st=Store.get(), def=WFFILL[id], wfd=WORKFLOWS.find(w=>w.id===id);
  if(!st.ciclo.wfAtivos[id]) return `<div class="empty">O workflow <b>${esc(wfd.nome)}</b> está desligado na configuração do ciclo.<br><br>
    ${st.papel==="rh"?`<button class="btn btn-primary" onclick="UI.cfgStep=2;A.go('config')">Abrir configuração</button>`:""}</div>`;
  const cadeia=st.workflow.cadeias[id];
  if(st.papel!=="gestor"){
    const subs=st.coleta.subs.filter(s=>s.wf===id);
    const local=st.coleta.wf[id];
    /* 6ª rodada: o Kanban não é privilégio do Quadro — toda pesquisa do orçamento tem o seu. */
    const tab=(UI.wfTab&&UI.wfTab[id])||"visao";
    const tabs=`<div class="tabs"><button class="${tab==="visao"?"on":""}" onclick="A.wfTab('${id}','visao')">Visão da operação</button>
      <button class="${tab==="kanban"?"on":""}" onclick="A.wfTab('${id}','kanban')">Kanban <span class="ct">${subs.length}</span></button></div>`;
    const corpo=tab==="kanban"?kanbanWf(id):`
    <div class="card"><div class="cb tight"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Gestor</th><th>CC</th><th>Situação</th><th class="num">Dias na etapa</th></tr></thead><tbody>
      ${CCS.map(c=>{
        const s=subs.find(x=>x.cc===c.id);
        const eu=c.id==="OP-BENEF";
        const envLocal=eu&&(id==="atual"?st.coleta.enviado:local?.enviado);
        const sit=s?("Etapa "+s.etapa+" · "+(cadeia[s.etapa-1]?.nome||"Concluído")):envLocal?"No fluxo":"Não iniciado";
        return `<tr><td><b>${esc(c.gestor)}</b></td><td>${c.id}</td>
        <td>${badge(sit,s||envLocal?"b-info":"b-neutral")}</td><td class="num">${s?s.dias:"—"}</td></tr>`;}).join("")}
      </tbody></table></div></div></div>`;
    return `<div class="page-head"><div><div class="eyebrow">Orçamento · acompanhamento</div>
      <h1>${esc(wfd.nome)} — acompanhamento</h1><p>${esc(def?.desc||"")} ${cadeia.length?cadeia.length+" etapas de aprovação.":"Sem aprovação — consolida direto no RH."}</p></div>
      <div class="spacer"></div>
      <button class="btn btn-sm" onclick="A.go('consolidacao')">Consolidação</button>
      <button class="btn btn-sm" onclick="A.go('home')">${ic("back","sm")} Portal</button></div>
    ${tabs}${corpo}`;
  }
  const w=st.coleta.wf[id];
  /* 6ª rodada · férias: modo "provisão somente" tira a programação da mão do gestor */
  if(id==="ferias"&&st.ciclo.ferias.modo==="provisao") return vFeriasProvisao(wfd,cadeia);
  const cell=(r,i,[k,lbl,tp])=>{
    if(tp==="ro") return `<td class="ro num">${esc(String(r[k]??"—"))}</td>`;
    /* vencimento: read-only, mas acusa quando a programação passa do limite legal */
    if(tp==="venc"){ const v=r[k]; const atraso=v&&((r.p1&&r.p1>v)||(r.p2&&r.p2>v));
      return `<td class="ro">${v?MESES[v-1]+"/27":"—"}${atraso?" "+badge("vence antes","b-bad"):""}</td>`;}
    /* 5ª rodada: colaborador vira lista de seleção (equipe do gestor), nunca texto livre */
    if(tp==="colab") return `<td class="ed"><select ${w.enviado?"disabled":""} style="min-width:150px"
      onchange="A.wfCell('${id}',${i},'${k}',this.value)" aria-label="${lbl}">
      <option value="">— escolher —</option>
      ${MEU_QUADRO.map(e=>`<option value="${esc(e.nome)}" ${r[k]===e.nome?"selected":""}>${esc(e.nome)} · ${esc(FUNCOES[e.func].nome)}</option>`).join("")}</select></td>`;
    if(tp==="tipoPdi") return `<td class="ed"><select ${w.enviado?"disabled":""} onchange="A.wfCell('${id}',${i},'${k}',this.value)" aria-label="${lbl}">
      ${TIPOS_PDI.map(t=>`<option ${r[k]===t?"selected":""}>${esc(t)}</option>`).join("")}</select></td>`;
    if(tp==="faixa") return `<td class="ed"><select ${w.enviado?"disabled":""} onchange="A.wfCell('${id}',${i},'${k}',parseFloat(this.value))" aria-label="${lbl}">
      ${[0.65,0.7,0.8,0.9,1,1.1,1.2].map(fx=>`<option value="${fx}" ${(r[k]||1)===fx?"selected":""}>×${fx.toLocaleString("pt-BR")}</option>`).join("")}</select></td>`;
    if(tp==="mes") return `<td class="ed"><select ${w.enviado?"disabled":""} onchange="A.wfCell('${id}',${i},'${k}',parseInt(this.value))" aria-label="${lbl}">
      <option value="0" ${!r[k]?"selected":""}>—</option>
      ${MESES.map((m,j)=>`<option value="${j+1}" ${r[k]===j+1?"selected":""}>${m}</option>`).join("")}</select></td>`;
    if(tp==="func") return `<td class="ed"><select ${w.enviado?"disabled":""} onchange="A.wfCell('${id}',${i},'${k}',this.value)" aria-label="${lbl}">
      ${Object.entries(FUNCOES).map(([f,ff])=>`<option value="${f}" ${r[k]===f?"selected":""}>${esc(ff.nome)}</option>`).join("")}</select></td>`;
    if(tp==="num") return `<td class="ed num"><input class="input mini num" type="number" min="0" ${w.enviado?"disabled":""} value="${r[k]}" onchange="A.wfCell('${id}',${i},'${k}',parseFloat(this.value)||0)" aria-label="${lbl}"></td>`;

/* Situação dos acessos: um CC por linha, com o responsável (perfil Gestores) que o atende.

function acessosDoCiclo(){
  const st=Store.get();

    const u=Engine.respDoCC(c.id);
    const dir=DIRS[c.dir];
    return {cc:c,resp:u,dir,pend:!u,convite:!!u&&u.st==="convite pendente"};
  });
}

"use strict";
/* Tipo da decisão — 5ª rodada: Promover (cargo+faixa destino) e Reconhecer (% de reajuste) */
const DECISOES={manter:"Manter",promover:"Promover",reconhecer:"Reconhecer",substituir:"Substituir",
  desligar:"Desligar",afastado:"Afastado",'':"— decidir"};
const TIPO_ABRE_SUB=d=>d==="promover"||d==="reconhecer";
/* % de mérito do ciclo — default sugerido ao Reconhecer */
const st_merito=()=>Store.get().ciclo.premissas.merito;
/* salário resultante e % implicado da decisão de uma linha */
function efeitoDecisao(e,d){
  if(d.d==="promover"){
    const cargo=d.cargo||(cargosDestino(e.func)[0]||[])[0];
    if(!cargo) return null;
    const novo=salDe(cargo,d.fx??1);
    return {novo,delta:novo-e.sal,pct:(novo/e.sal-1)*100,cargo};
  }
  if(d.d==="reconhecer"){
    const p=d.pct??0, novo=e.sal*(1+p/100);
    return {novo,delta:novo-e.sal,pct:p};
  }
  return null;
}

  <p class="muted" style="font-size:11px;margin-top:6px">Base de referência do quadro extraída em 30/06/2026 — colunas travadas; tipo, mês, campos do tipo e observação editáveis (padrão da planilha atual).
    <b>Promover</b> leva a outro cargo (lista dinâmica a partir do cargo atual) e calcula o % implicado; <b>Reconhecer</b> é % de reajuste no mesmo cargo.</p>

/* Kanban de um workflow — colunas = cadeia daquele workflow (6ª rodada: serve todas as
   pesquisas do orçamento, não só o Quadro; usado na Consolidação e no acompanhamento de cada grade). */
function kanbanWf(wfId){
  const st=Store.get(), cadeia=["Preenchimento",...st.workflow.cadeias[wfId].map(e=>e.nome),"Concluído"];
  const total=st.coleta.subs.filter(s=>s.wf===wfId).length;
  return `<div class="kb">${cadeia.map((et,i)=>{
      const cc=st.coleta.subs.filter(s=>s.wf===wfId&&s.etapa===i);
      return `<div class="col"><h4>${esc(et)}<span>${cc.length}</span></h4>
        ${cc.map(s=>{const c=CCS.find(x=>x.id===s.cc);
          const sla=st.workflow.cadeias[wfId][i-1]?.sla??3;
          return `<div class="kb-card"><b>${s.cc}</b> · ${esc(c.gestor)}
            <div class="muted" style="margin:3px 0">${esc(c.nome)}</div>
            <div class="flex between"><span class="muted num">${s.dias}d na etapa</span>
            ${s.dias>sla?badge("Atrasado","b-bad"):badge("No prazo","b-ok")}</div></div>`;}).join("")}
      </div>`;}).join("")}</div>
    <p class="muted" style="font-size:11.5px;margin-top:8px">${total?"Card = 1 submissão por gestor/CC.":"Nenhuma submissão neste fluxo ainda."}
      SLA por etapa vem do workflow (fase 2). ${pin(4,"quadro")}</p>`;
}

          <td>${badge(g.est,g.est==="Atrasado"?"b-bad":g.est==="No RH"?"b-ok":g.est==="Em preenchimento"?"b-warn":"b-info")}</td>

      <div class="card"><div class="ch"><h3>Fechamento do quadro</h3>${pin(3,"quadro")}</div><div class="cb">

const BLK_COLS={
  vagas:[["cc","Centro de custo","cc"],["func","Função","func"],["qtd","Qtd","num"],["mes","Mês","mes"],["motivo","Motivo","txt"]],
  deslig:[["cc","Centro de custo","cc"],["func","Função","func"],["qtd","Qtd","num"],["mes","Mês","mes"],["motivo","Motivo","txt"]],
  afast:[["cc","Centro de custo","cc"],["func","Função","func"],["qtd","Qtd","num"],["mes","Mês","mes"],["motivo","Motivo","txt"]],

  afast:{cc:"OP-BENEF",func:"OPB-005",qtd:-1,mes:1,tipo:"afastamento",origem:"cenário",motivo:"Ajuste do RH"},

/* célula editável de uma linha de bloco */
function blkCell(cid,bloco,i,r,[k,lbl,tp]){
  const ac=`A.cenLinha('${cid}','${bloco}',${i},'${k}',`;
  if(tp==="cc") return `<td class="ed"><select class="select mini" onchange="${ac}this.value)" aria-label="${lbl}">
    ${CCS.map(c=>`<option value="${c.id}" ${r.cc===c.id?"selected":""}>${c.id}</option>`).join("")}</select></td>`;
  if(tp==="func") return `<td class="ed"><select class="select mini" onchange="${ac}this.value)" aria-label="${lbl}">
    ${Object.entries(FUNCOES).map(([f,ff])=>`<option value="${f}" ${r[k]===f?"selected":""}>${esc(ff.nome)}</option>`).join("")}</select></td>`;
  if(tp==="mes") return `<td class="ed"><select class="select mini" onchange="${ac}parseInt(this.value))" aria-label="${lbl}">
    ${MESES.map((m,j)=>`<option value="${j+1}" ${r[k]===j+1?"selected":""}>${m}</option>`).join("")}</select></td>`;
  if(tp==="num") return `<td class="ed num"><input class="input mini num" type="number" value="${r[k]??0}"
    onchange="${ac}parseInt(this.value)||0)" aria-label="${lbl}"></td>`;
  return `<td class="ed"><input class="input" style="min-width:150px" value="${esc(r[k]||"")}" onchange="${ac}this.value)" aria-label="${lbl}"></td>`;
}

/* barra de ajuste global do bloco (% aumentando/diminuindo, corte de custos) */
function ajusteBar(cid,bloco,valor,rotulo){
  const stp=[-20,-10,-5,5,10,20];
  return `<div class="adj">${ic("bolt","sm")}
    <b>${esc(rotulo||"Ajustar o bloco inteiro")}</b>
    <span class="stp">${stp.map(p=>`<button onclick="A.cenAjuste('${cid}','${bloco}',${valor+p})">${p>0?"+":""}${p}%</button>`).join("")}</span>
    <input class="input mini num" type="number" step="1" value="${valor}" aria-label="Ajuste percentual do bloco"
      onchange="A.cenAjuste('${cid}','${bloco}',parseFloat(this.value)||0)"> %
    ${valor?`<button class="btn btn-sm" onclick="A.cenAjuste('${cid}','${bloco}',0)">Zerar</button>
      <span class="badge b-warn">ajuste ativo ${valor>0?"+":""}${fmtPct(valor,0)}</span>`:""}
  </div>`;
}

        <div class="tblwrap"><table class="tbl xl">

          <tbody>${linhas.map((r,i)=>{

/* mantida só como referência histórica do texto da 4ª rodada */
/* ============================================================
   RESULTADOS (5ª rodada · D31) — VISIBILIDADE APENAS.
   Nenhuma edição acontece aqui: só a leitura e a comparação
   (baseline × cenários  ou  cenário × cenário).
   Toda edição vive em #cenarios.
   ============================================================ */
/* seletor de comparação — compartilhado pelos dois resultados */
function cmpSel(){
  const st=Store.get(), lista=st.papel==="gestor"?st.cenarios.filter(c=>c.oficial):st.cenarios;
  const a=UI.cmpA||"base26", b=UI.cmpB||(st.cenarios.find(c=>c.oficial)||st.cenarios[0]).id;
  return {lista,a,b,
    html:`<div class="toolbar">
      <span class="muted" style="font-size:12px;font-weight:600">Comparar</span>
      <select class="filt" aria-label="Referência" onchange="A.cmp('A',this.value)">
        <option value="base26" ${a==="base26"?"selected":""}>Baseline 2026</option>
        ${lista.map(c=>`<option value="${c.id}" ${a===c.id?"selected":""}>${esc(c.nome)}${c.oficial?" (oficial)":""}</option>`).join("")}
      </select>
      <span class="muted" style="font-size:13px">×</span>
      <select class="filt" aria-label="Cenário" onchange="A.cmp('B',this.value)">
        ${lista.map(c=>`<option value="${c.id}" ${b===c.id?"selected":""}>${esc(c.nome)}${c.oficial?" (oficial)":""}</option>`).join("")}
      </select>
      <div class="chip" role="group" aria-label="Modo de variância">
        <button class="${UI.varMode==="pct"?"":"muted"}" onclick="A.varMode('pct')">Δ %</button> ·
        <button class="${UI.varMode==="abs"?"":"muted"}" onclick="A.varMode('abs')">Δ R$</button></div>
      <span style="flex:1"></span>
      ${badge("somente leitura","b-neutral")}
      ${(st.papel==="rh"||st.papel==="pc")?`<button class="btn btn-sm" onclick="A.go('cenarios')">${ic("cog","sm")} Editar em Cenários</button>`:""}
    </div>`};
}
/* resolve um lado da comparação para {nome, cen, res, hcDez} */
function cmpLado(id){
  if(id==="base26"){const r=Engine.custo(null);
    return {nome:"Baseline 2026",cen:null,res:r,hcDez:1284,base:true};}
  const c=Engine.cenPorId(id)||Engine.oficial();
  return {nome:c.nome,cen:c,res:Engine.custo(c),
    hcDez:Engine.quadroMensal(c).reduce((s,x)=>s+x.qtd[11],0)};
}

function vResultadoHC(){
  const st=Store.get();
  if(!st.quadroFechado) return `<div class="empty">O resultado de headcount abre depois do <b>fechamento do quadro</b>.<br><br>
    <button class="btn btn-primary" onclick="A.go('consolidacao')">Ir para a consolidação</button></div>`;
  const S=cmpSel(), A_=cmpLado(S.a), B_=cmpLado(S.b);
  const serieA=A_.base?Array(12).fill(1284):MESES.map((_,m)=>Engine.quadroMensal(A_.cen).reduce((s,r)=>s+r.qtd[m],0));
  const serieB=MESES.map((_,m)=>Engine.quadroMensal(B_.cen).reduce((s,r)=>s+r.qtd[m],0));
  const dHc=B_.hcDez-A_.hcDez, dCusto=B_.res.total-A_.res.total;
  const movsB=Engine.movimentos(B_.cen);
  const porCC=CCS.map(c=>{
    const qa=A_.base?QUADRO.filter(q=>q[0]===c.id).reduce((s,q)=>s+q[2],0)
      :Engine.quadroMensal(A_.cen).filter(r=>r.cc===c.id).reduce((s,r)=>s+r.qtd[11],0);
    const qb=Engine.quadroMensal(B_.cen).filter(r=>r.cc===c.id).reduce((s,r)=>s+r.qtd[11],0);
    return {c,qa,qb,d:qb-qa};}).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  return `<div class="page-head"><div><div class="eyebrow">Resultado · headcount</div>
    <h1>Resultado de headcount</h1><p>Visão de resultado: escolha o que comparar — <b>baseline × cenário</b> ou
      <b>cenário × cenário</b>. Nada se edita aqui. ${pin(3,"quadro")}</p></div>
    <div class="spacer"></div>${badge("Baseline v1 · "+st.baselineEm,"b-ok")}</div>
  ${S.html}
  <div class="grid g4">
    ${kpi("Headcount dez/27 · "+esc(B_.nome),fmtInt(B_.hcDez),(dHc>=0?"+":"")+dHc+" vs "+esc(A_.nome),dHc>0?"up":dHc<0?"down":"flat")}
    ${kpi("Referência · "+esc(A_.nome),fmtInt(A_.hcDez),"posições em dez/27")}
    ${kpi("Movimentos aplicados",movsB.length,"admissões, desligamentos e afastamentos")}
    ${kpi("Custo do quadro",fmtMi(B_.res.total),sgn(dCusto)+" vs "+esc(A_.nome),dCusto>0?"up":"down")}
  </div>
  <div class="grid g23" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Headcount mensal — ${esc(A_.nome)} × ${esc(B_.nome)}</h3></div><div class="cb">
      ${lineChart({series:[
        {nome:A_.nome,cor:"var(--s2)",vals:serieA},
        {nome:B_.nome,cor:"var(--s1)",vals:serieB},
      ],labels:MESES,min:1200,fmt:v=>fmtInt(v)+" posições",yFmt:v=>fmtInt(v),aria:"Headcount mensal comparado"})}
      <p class="muted" style="font-size:11px">Posições ativas por mês; eixo a partir de 1.200 para leitura do delta.</p>
    </div></div>
    <div class="card"><div class="ch"><h3>Onde está a diferença</h3></div><div class="cb tight"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>CC</th><th class="num">${esc(A_.nome)}</th><th class="num">${esc(B_.nome)}</th><th class="num">Δ</th></tr></thead><tbody>
      ${porCC.map(({c,qa,qb,d})=>`<tr><td><b>${c.id}</b></td><td class="num muted">${fmtInt(qa)}</td>
        <td class="num">${fmtInt(qb)}</td>
        <td class="num" style="color:${d>0?"var(--bad)":d<0?"var(--ok)":"var(--ink-3)"}">${d?(d>0?"+":"")+d:"—"}</td></tr>`).join("")}
      </tbody></table></div></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ch"><h3>Movimentos de ${esc(B_.nome)}</h3>
    <span class="spacer"></span>${badge(movsB.length+" movimentos","b-info")}</div>
    <div class="cb tight"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>Origem</th><th>CC</th><th>Tipo</th><th>Função</th><th class="num">Qtd</th><th>Mês</th><th>Motivo</th><th class="num">Impacto anualizado</th></tr></thead><tbody>
    ${movsB.map(m=>{const v=Engine.custoMov(m.func,Math.abs(m.qtd),m.mes||1)*(m.qtd<0?-1:1);
      return `<tr><td>${badge(m.origem,m.origem==="Novas vagas"?"b-ai":"b-neutral")}${m.origem==="Novas vagas"?pin(5,"quadro"):""}</td>
      <td><b>${m.cc}</b></td><td>${badge(m.tipo==="admissao"?"Admissão":m.tipo==="desligamento"?"Desligamento":"Afastamento",m.qtd>0?"b-ok":"b-bad")}</td>
      <td>${esc(FUNCOES[m.func].nome)}</td><td class="num">${m.qtd>0?"+":""}${m.qtd}</td><td>${MESES[(m.mes||1)-1]}/27</td>
      <td class="muted">${esc(m.motivo||"")}</td><td class="num">${sgn(v)}</td></tr>`;}).join("")
      ||`<tr><td colspan="8"><div class="empty">Este cenário não tem movimentos ativos.</div></td></tr>`}
    </tbody></table></div></div></div>
  <div class="card" style="margin-top:14px"><div class="ch"><h3>Todos os cenários, lado a lado</h3>
    <span class="spacer"></span><span class="muted" style="font-size:11px">leitura — para mudar, abra Cenários</span></div>
    <div class="cb tight"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>Cenário</th><th class="num">Headcount dez/27</th><th class="num">Custo 2027</th><th class="num">Δ vs 2026</th><th>Situação</th></tr></thead><tbody>
    ${S.lista.map(c=>{const r=Engine.custo(c), hc=Engine.quadroMensal(c).reduce((s,x)=>s+x.qtd[11],0);
      const b26=Engine.custo(null);
      return `<tr><td><b>${esc(c.nome)}</b><div class="muted" style="font-size:11px">${esc(c.origem)}</div></td>
        <td class="num">${fmtInt(hc)}</td><td class="num">${fmtMi(r.total)}</td>
        <td class="num" style="color:${(r.total/b26.total-1)*100>Store.get().ciclo.premissas.teto?"var(--bad)":"var(--ok)"}">${fmtPct((r.total/b26.total-1)*100)}</td>
        <td>${c.oficial?badge("Oficial","b-brand"):c.status==="submetido"?badge("Em aprovação","b-info"):badge("Rascunho","b-neutral")}</td></tr>`;}).join("")}
    </tbody></table></div></div></div>`;
}

function vResultadoCusto(){
  const st=Store.get();
  if(!st.custo.rodado||!st.quadroFechado) return `<div class="empty">O resultado de custo abre depois da <b>rodagem</b>.<br><br>
    ${st.papel==="rh"?`<button class="btn btn-primary" onclick="A.go('custo')">Ir para a rodagem</button>`:"Aguarde o RH rodar o custo."}</div>`;
  const S=cmpSel(), A_=cmpLado(S.a), B_=cmpLado(S.b);
  const wf=Engine.waterfall(B_.cen);
  const d=B_.res.total-A_.res.total, dp=d/Math.max(1,A_.res.total)*100;
  const TODAS=[...VERBAS,...(st.verbas.extras||[])].filter(v=>st.verbas.ativas[v.id]!==false);
  const dv=v=>(B_.res.verbaTotal[v.id]||0)-(A_.res.verbaTotal[v.id]||0);
  const topVerbas=[...TODAS].sort((a,b)=>Math.abs(dv(b))-Math.abs(dv(a))).slice(0,10);
  return `<div class="page-head"><div><div class="eyebrow">Resultado · custo</div>
    <h1>Resultado de custo</h1><p>Visão de resultado: <b>baseline × cenário</b> ou <b>cenário × cenário</b>,
      com ponte, evolução mensal e detalhe por verba. Nada se edita aqui. ${pin(2,"verbas-custo")}</p></div>
    <div class="spacer"></div>
    ${st.publicado?badge("Orçamento 2027 publicado","b-ok"):badge("Pré-publicação","b-warn")}</div>
  ${S.html}
  <div class="grid g4">
    ${kpi("Custo 2027 · "+esc(B_.nome),fmtMi(B_.res.total),sgn(d)+" vs "+esc(A_.nome),d>0?"up":"down")}
    ${kpi("Referência · "+esc(A_.nome),fmtMi(A_.res.total),"base da comparação")}
    ${kpi("Variação",fmtPct(dp),"teto do ciclo "+fmtPct(st.ciclo.premissas.teto,0),dp>st.ciclo.premissas.teto?"up":"down")}
    ${kpi("Custo por posição",fmtMil(B_.res.total/12/Math.max(1,B_.res.hc[11])),"mensal · dez/27")}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Ponte 2026 → 2027 · ${esc(B_.nome)}</h3></div><div class="cb">
      ${waterfallChart({steps:wf.steps,aria:"Ponte do custo 2026 para 2027"})}
    </div></div>
    <div class="card"><div class="ch"><h3>Evolução mensal — ${esc(A_.nome)} × ${esc(B_.nome)}</h3></div><div class="cb">
      ${lineChart({series:[

    ${topVerbas.map(v=>{const a=A_.res.verbaTotal[v.id]||0,b=B_.res.verbaTotal[v.id]||0,dd=b-a;

/* ============================================================
   VARIÁVEIS DE CÁLCULO (6ª rodada) — a área de cadastro que absorve o detalhe infinito.
   Toda regra de CCT/ACT que "sempre tem um detalhezinho" é a mesma coisa: um valor que muda
   por dimensão. Em vez de uma tela nova por regra, o cliente cadastra a variável aqui e
   amarra na verba — o motor resolve o valor pela dimensão do colaborador.
   ============================================================ */
function vParametros(){
  const st=Store.get(), lista=st.parametros||[];
  const TODAS=[...VERBAS,...(st.verbas.extras||[])];
  const sel=lista.find(p=>p.id===UI.paramSel)||lista[0];
  const q=F("param","q"), fd=F("param","dim");
  const vis=ordenarPor("param",
    lista.filter(p=>hit(q,p.nome,p.chave,dimDe(p.dim).nome))
         .filter(p=>!fd||dimDe(p.dim).nome===fd), p=>p.nome);
  const incompletas=lista.filter(p=>p.ativa!==false&&dimDe(p.dim).membros().some(([k])=>p.vals[k]==null)).length;
  const detalhe=()=>{
    if(!sel) return `<div class="card"><div class="cb"><div class="empty">Nenhuma variável cadastrada ainda.</div></div></div>`;
    const dim=dimDe(sel.dim), membros=dim.membros();
    const daBase=String(sel.fonte||"").startsWith("base:");
    const baseId=daBase?sel.fonte.slice(5):null;
    return `<div class="card"><div class="ch"><h3>${esc(sel.nome)}</h3>
      ${sel.ativa===false?badge("Desligada","b-neutral"):badge("Ativa","b-ok")}
      <span class="spacer"></span>
      <span class="chip mono" style="font-size:11px">${esc(sel.chave)}</span>
      <button class="btn btn-sm" onclick="A.paramRm('${sel.id}')" aria-label="Remover variável">${ic("trash","sm")}</button></div>
      <div class="cb">
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">${esc(sel.obs||"")}</p>
      <div class="row c2">
        <div class="field"><label>Dimensão</label>
          <select class="select" onchange="A.paramSet('${sel.id}','dim',this.value)" aria-label="Dimensão">
            ${DIMENSOES.map(d=>`<option value="${d.id}" ${sel.dim===d.id?"selected":""}>${esc(d.nome)}</option>`).join("")}</select>
          <div class="hint">O valor muda por membro desta dimensão.</div></div>
        <div class="field"><label>Tipo</label>
          <select class="select" onchange="A.paramSet('${sel.id}','tipo',this.value)" aria-label="Tipo">
            ${TIPOS_VAR.map(([t,l])=>`<option value="${t}" ${sel.tipo===t?"selected":""}>${esc(t)} (${l})</option>`).join("")}</select></div>
        <div class="field"><label>Vigência</label>
          <input class="input" value="${esc(sel.vig||"")}" onchange="A.paramSet('${sel.id}','vig',this.value)">
          <div class="hint">A partir de quando este valor vale.</div></div>

/* ---------- Custo (rodagem) ---------- */
function vCusto(){
  const st=Store.get(), cen=Engine.oficial();
  if(!st.quadroFechado) return `<div class="empty">Feche o quadro (baseline) e oficialize um cenário para rodar o custo.<br><br>
    <button class="btn btn-primary" onclick="A.go('consolidacao')">Ir para a consolidação</button></div>`;
  const rodando=UI.custoLog.length>0&&!UI.custoDone;
  const wf=Engine.waterfall(cen), res=wf.res;
  const dpct=(wf.t27/wf.t26-1)*100;
  return `<div class="page-head"><div><div class="eyebrow">Fase 5 · Custeio</div>
    <h1>Rodagem do custo</h1><p>Cenário de quadro oficial: <b>${esc(cen.nome)}</b> · dissídio por data-base de sindicato · verbas na ordem do DAG. ${pin(1,"verbas-custo")}</p></div>
    <div class="spacer"></div>
    <div class="wrapf">${Object.entries(st.ciclo.premissas.reajustes).map(([s,v])=>`<span class="chip">${s} · ${fmtPct(v)} em ${MESES[SINDICATOS[s].dataBase-1]}</span>`).join("")}</div>
    <button class="btn btn-primary" onclick="A.rodarCusto()" ${rodando?"disabled":""}>${ic("play")} ${st.custo.rodado?"Re-rodar custo":"Rodar custo"}</button></div>
  ${UI.custoLog.length?`<div class="runlog" id="runlog" aria-live="polite">${UI.custoLog.join("<br>")}</div>`:""}
  ${st.custo.rodado&&!rodando?`
  <div class="grid g4" style="margin-top:14px">
    ${kpi("Orçamento 2027",fmtMi(wf.t27),sgn(wf.t27-wf.t26)+" vs 2026",dpct>st.ciclo.premissas.teto?"up":"flat")}
    ${kpi("Variação",fmtPct(dpct),"teto "+fmtPct(st.ciclo.premissas.teto,0),dpct>st.ciclo.premissas.teto?"up":"down")}
    ${kpi("Custo médio por posição",fmtMil(wf.t27/12/Math.max(1,res.hc[11])),"mensal · dez/27")}
    ${kpi("Encargos + provisões",fmtPct((res.grupoTotal["Encargos"]+res.grupoTotal["Provisões"])/wf.t27*100),"do custo total")}
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Ponte 2026 → 2027 (waterfall)</h3>${pin(2,"verbas-custo")}</div><div class="cb">
      ${waterfallChart({steps:wf.steps,aria:"Ponte do custo 2026 para 2027"})}
    </div></div>
    <div class="card"><div class="ch"><h3>Os mesmos números, exatos</h3></div><div class="cb tight"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>Componente</th><th class="num">Valor</th><th class="num">Acumulado</th></tr></thead><tbody>
      ${(()=>{let run=0;return wf.steps.map(s=>{run=s.tipo==="total"?s.val:run+s.val;
        return `<tr><td>${s.tipo==="total"?"<b>"+esc(s.nome)+"</b>":esc(s.nome)}</td>
        <td class="num">${s.tipo==="total"?"<b>"+fmtMi(s.val)+"</b>":sgn(s.val)}</td>
        <td class="num muted">${fmtMi(run)}</td></tr>`;}).join("");})()}
      </tbody></table></div></div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Evolução mensal por grupo</h3></div><div class="cb">
      ${lineChart({series:[
        {nome:"Remuneração",cor:"var(--s1)",vals:res.porGrupo["Remuneração"]},
        {nome:"Encargos",cor:"var(--s2)",vals:res.porGrupo["Encargos"]},
        {nome:"Benefícios",cor:"var(--s3)",vals:res.porGrupo["Benefícios"]},
      ],labels:MESES,aria:"Evolução mensal do custo por grupo de verba"})}
      <p class="muted" style="font-size:11px">Degraus = datas-base dos sindicatos (mar · mai · set) e entrada de movimentos.
        Fora do gráfico por escala: <b>Provisões</b> acompanham a remuneração e <b>Movimentação</b> (${fmtMil(res.grupoTotal["Movimentação"]||0)} no ano)
        só aparece nos meses de admissão/desligamento — ambas na matriz ao lado e na tabela por verba.</p>
    </div></div>
    <div class="card"><div class="ch"><h3>Matriz grupo × centro de custo</h3></div><div class="cb tight"><div class="tblwrap"><table class="tbl">
      <thead><tr><th>CC</th>${GRUPOS.map(g=>`<th class="num">${g}</th>`).join("")}<th class="num">Total</th></tr></thead><tbody>
      ${CCS.map(c=>{
        const rows=Engine.quadroMensal(cen).filter(r=>r.cc===c.id);
        const tot=res.porCC[c.id];
        return `<tr><td><b>${c.id}</b></td>${GRUPOS.map(g=>`<td class="num muted">${fmtMil(tot*res.grupoTotal[g]/wf.t27)}</td>`).join("")}
        <td class="num"><b>${fmtMil(tot)}</b></td></tr>`;}).join("")}
      </tbody><tfoot><tr><td>Total</td>${GRUPOS.map(g=>`<td class="num">${fmtMi(res.grupoTotal[g])}</td>`).join("")}<td class="num">${fmtMi(wf.t27)}</td></tr></tfoot>
      </table></div></div></div>
  </div>
  <div class="card" style="margin-top:14px"><div class="ch"><h3>Detalhe por verba</h3></div><div class="cb tight"><div class="tblwrap"><table class="tbl">
    <thead><tr><th>Verba</th><th>Grupo</th><th>Conta contábil</th><th class="num">Total 2027</th><th class="num">% do custo</th></tr></thead><tbody>
    ${[...VERBAS,...(st.verbas.extras||[])].filter(v=>st.verbas.ativas[v.id]!==false).map(v=>`<tr><td><b>${esc(v.nome)}</b>${v.extra?" "+badge("IA","b-ai"):""}</td><td>${v.grupo}</td>
      <td class="mono">${esc(contaDe(v))}</td><td class="num">${fmtMi(res.verbaTotal[v.id]||0)}</td>
      <td class="num muted">${fmtPct((res.verbaTotal[v.id]||0)/wf.t27*100)}</td></tr>`).join("")}
    </tbody></table></div></div></div>
  <div class="flex" style="margin-top:14px;justify-content:flex-end">
    <button class="btn" onclick="A.go('cenarios')">${ic("copy")} Ajustar em Cenários</button>
    <button class="btn btn-primary" onclick="A.go('resultado-custo')">${ic("eye")} Ver o resultado de custo</button></div>`:""}`;
}

<script>
/* ============================================================

"use strict";
/* ============================================================

/* ---------- ORGANOGRAMA — árvore por gestor imediato, com custo e contagem ---------- */
function orgNo(n,nivel,q){
  const aberto=(UI.orgOpen||{})[n.id]!==false&&nivel<2||(UI.orgOpen||{})[n.id]===true;
  const temFilhos=n.filhos&&n.filhos.length;
  const casa=!q||norm(n.nome).includes(norm(q))||(n.gestor&&norm(n.gestor).includes(norm(q)));
  const filhosHtml=temFilhos?n.filhos.map(f=>orgNo(f,nivel+1,q)).join(""):"";
  if(q&&!casa&&!filhosHtml.trim()) return "";
  return `<div class="orgn lvl${nivel+1} ${aberto||q?"open":""}">
    <div class="oh" ${temFilhos?`onclick="A.orgToggle('${n.id}')"`:""}>
      <span class="ms car" style="${temFilhos?"":"opacity:0"}">chevron_right</span>
      <span class="onm">${esc(n.nome)}${n.gestor?` <span class="muted" style="font-weight:400">· ${esc(n.gestor)}</span>`:""}</span>
      <span class="om">
        <span class="muted">HC <b>${fmtInt(n.hc)}</b></span>
        <span class="muted">Custo <b>${fmtMil(n.custo)}</b></span>
        <span class="muted">Médio <b>${fmtMil(n.custo/12/Math.max(1,n.hc))}</b></span>
      </span>
    </div>
    ${temFilhos?`<div class="ob">${filhosHtml}</div>`:""}
  </div>`;
}

  const lista=st.papel==="gestor"?st.cenarios.filter(c=>c.oficial):st.cenarios;
  return `<div class="page-head"><div><div class="eyebrow">Estrutura · posição e posição pai</div>
    <h1>Organograma</h1><p>Visão por <b>gestor imediato</b>, montada sobre a base <b>Posições</b> (id da posição e posição pai).
      Cada nó soma headcount e custo do cenário escolhido — diretoria, centro de custo e função.</p></div>

    <button class="btn" onclick="A.orgTodos(true)">${ic("plus")} Expandir tudo</button>
    <button class="btn" onclick="A.orgTodos(false)">Recolher tudo</button>
    <span style="flex:1"></span>
    <button class="btn" onclick="A.baseVer('posicoes')">${ic("table")} Ver base Posições</button></div>
  <div class="grid g4" style="margin-bottom:14px">
    ${kpi("Headcount total",fmtInt(arv.hc),"posições ativas em dez/27")}
    ${kpi("Custo total",fmtMi(arv.custo),"cenário "+esc(cen.nome))}

    <span class="om" style="display:flex;gap:16px;font-size:12.5px"><span class="muted">HC <b>${fmtInt(arv.hc)}</b></span>
      <span class="muted">Custo <b>${fmtMi(arv.custo)}</b></span></span></div>
    <div class="cb"><div class="org">${arv.filhos.map(d=>orgNo(d,0,q)).join("")||`<div class="empty">Nada encontrado.</div>`}</div></div></div>
  <p class="muted" style="font-size:11.5px;margin-top:8px">Cada nó é uma posição com posição pai — a hierarquia fecha na diretoria.
    O custo do nó folha é rateado pelo headcount da função dentro do centro de custo.</p>`;
}

    ["Início do ciclo","Quando o RH abre o ciclo, todos os gestores com grade recebem e-mail e aviso na plataforma.","ciclo",true],

    ["Devolução com comentário","Quem enviou recebe o comentário do aprovador junto com o item devolvido.","aprovacao",true],
    ["Fechamento da janela","Três dias antes de fechar a coleta, para quem ainda não enviou.","lembrete",true],

            <button class="btn btn-sm" onclick="A.ntfEmail('${n.id}')">${ic("doc","sm")} E-mail</button>
          </div>
        </div>`).join("")||`<div class="empty">Nenhuma notificação com este filtro.</div>`}
      </div></div>
    <div>
      <div class="card"><div class="ch"><h3>Regras de disparo</h3></div><div class="cb">
        ${REGRAS.map(([nome,txt,tipo,on],i)=>`
          <div class="flex between" style="padding:9px 0;border-bottom:1px solid var(--line-2);align-items:flex-start">
            <div style="flex:1"><b style="font-size:12.5px">${esc(nome)}</b>
              <div class="muted" style="font-size:11.5px;margin-top:2px">${esc(txt)}</div></div>
            <button class="switch ${on?"on":""}" role="switch" aria-checked="${on}" aria-label="${esc(nome)}"
              onclick="A.ntfRegra(${i})"><i></i></button></div>`).join("")}
        <p class="muted" style="font-size:11px;margin-top:10px">Canais: e-mail e aviso na plataforma (sino da barra superior).

      </div></div>
      <div class="ai-inline" style="margin-top:12px"><span class="tag">IA</span>
        <span><b>Sugestão:</b> 3 das 5 notificações de SLA deste ciclo foram para a mesma etapa (Diretor do CC).
          Antecipar o lembrete em 1 dia reduziria o atraso médio da cadeia.</span></div>

/* ---------- CONFORMIDADE — as verbas estão aplicadas de forma coerente? ---------- */
function vConformidade(){
  const st=Store.get();
  const cen=Engine.oficial();
  const itens=Engine.conformidade(cen);
  const erros=itens.filter(i=>i.sev==="erro").length, avisos=itens.length-erros;

const AP_COLS=["Gestor","Diretor do CC","RH","Financeiro / P&C","CFO","Concluído"];
function apColuna(ap){
  const e=(ap.etapas[ap.etapa-1]||"").toLowerCase();
  if(e.includes("cfo"))return "CFO";
  if(e.includes("financeiro"))return "Financeiro / P&C";
  if(e.includes("rh"))return "RH";
  if(e.includes("diretor"))return "Diretor do CC";
  return "Gestor";
}
const AP_PAPEL_NOME={pc:"CFO / Financeiro",gestor:"Marcos Andrade (gestor)",rh:"RH"};
const AP_DIR=ref=>{const cc=CCS.find(c=>ref.includes(c.id));return cc?DIRS[cc.dir].nome.replace("Diretoria ",""):"—";};

/* ---------- Detalhe do item em aprovação (5ª rodada): totalizadores em R$ + linha a linha ----------
   Toda aprovação abre com o QUE está sendo aprovado: cards com R$ e a tabela item a item. */
function apDetalhe(ap){
  const st=Store.get(), cc=CCS.find(c=>ap.ref.includes(c.id));
  const F_=f=>FUNCOES[f];
  if(ap.tipo==="Cenário de custo"){
    const cen=st.cenarios.find(c=>ap.ref.startsWith(c.nome))||Engine.oficial();
    const r=Engine.custo(cen), b=Engine.custo(null);
    return {cards:[["Custo 2027",fmtMi(r.total)],["Δ vs 2026",sgn(r.total-b.total)],
        ["Headcount dez/27",fmtInt(r.hc[11])],["Custo médio mensal",fmtMil(r.total/12/Math.max(1,r.hc[11]))]],
      cols:["Grupo de verba","Baseline 2026","Cenário 2027","Δ R$","Δ %"],
      linhas:GRUPOS.map(g=>{const a=b.grupoTotal[g],x=r.grupoTotal[g];
        return [g,fmtMi(a),fmtMi(x),sgn(x-a),fmtPct((x/Math.max(1,a)-1)*100)];}),
      total:["Total",fmtMi(b.total),fmtMi(r.total),sgn(r.total-b.total),fmtPct((r.total/b.total-1)*100)],
      link:["Ver resultado completo","resultado-custo"]};
  }
  if(ap.tipo==="Novas vagas"){
    const movs=Engine.linhasBloco(Engine.oficial(),"vagas").filter(m=>!cc||m.cc===cc.id);
    const mensal=movs.reduce((s,m)=>s+F_(m.func).sal*1.65*m.qtd,0);
    return {cards:[["Posições",fmtInt(movs.reduce((s,m)=>s+m.qtd,0))],["Valor mensal",fmtR(mensal)],
        ["Valor anual",fmtMil(mensal*12)],["Impacto no ciclo",fmtMil(movs.reduce((s,m)=>s+Engine.custoMov(m.func,m.qtd,m.mes||1),0))]],
      cols:["Função","CC","Qtd","Mês","Motivo","Mensal (R$)","Impacto no ciclo"],
      linhas:movs.map(m=>[F_(m.func).nome,m.cc,String(m.qtd),MESES[(m.mes||1)-1]+"/27",m.motivo||"—",
        fmtR(F_(m.func).sal*1.65*m.qtd),fmtMil(Engine.custoMov(m.func,m.qtd,m.mes||1))]),
      total:["Total","","","","",fmtR(mensal),fmtMil(movs.reduce((s,m)=>s+Engine.custoMov(m.func,m.qtd,m.mes||1),0))],
      link:["Ver resultado de headcount","resultado-hc"]};
  }
  if(ap.tipo==="Promoções"){
    const rows=(st.coleta.wf.promo?.rows||[]);
    const linhas=rows.map(r=>{const at=(MEU_QUADRO.find(x=>x.nome===r.colab)||{}).sal||0;
      const nv=salDe(r.para,r.faixa);
      return [r.colab||"—",at?FUNCOES[(MEU_QUADRO.find(x=>x.nome===r.colab)||{}).func]?.nome||"—":"—",
        F_(r.para).nome,"×"+(r.faixa||1).toLocaleString("pt-BR"),MESES[(r.mes||1)-1]+"/27",
        at?fmtR(at):"—",fmtR(nv),at?sgn(nv-at):"—",at?fmtPct((nv/at-1)*100):"—"];});
    const dMensal=rows.reduce((s,r)=>{const at=(MEU_QUADRO.find(x=>x.nome===r.colab)||{}).sal||0;
      return s+(at?salDe(r.para,r.faixa)-at:0);},0);
    return {cards:[["Promoções",String(rows.length)],["Aumento mensal",fmtR(dMensal)],
        ["Aumento anual",fmtMil(dMensal*12)],["Com encargos (ano)",fmtMil(dMensal*1.85*12)]],
      cols:["Colaborador","Cargo atual","Cargo destino","Faixa","Mês","Salário atual","Salário destino","Δ R$","Δ %"],
      linhas,total:["Total","","","","","",""," "+sgn(dMensal),""],
      link:["Abrir a grade de Promoções","wf-promo"]};
  }
  if(ap.tipo==="Férias"){
    const rows=(st.coleta.wf.ferias?.rows||[]);
    const prov=rows.reduce((s,r)=>{const e=MEU_QUADRO.find(x=>x.nome===r.colab);
      return s+((e?e.sal:3400)/30*((r.d1||0)+(r.d2||0))*1.3333);},0);
    return {cards:[["Colaboradores",String(rows.length)],["Dias programados",String(rows.reduce((s,r)=>s+(r.d1||0)+(r.d2||0),0))],
        ["Provisão do terço",fmtR(prov)],["Saldo médio",Math.round(rows.reduce((s,r)=>s+(r.saldo||0),0)/Math.max(1,rows.length))+" dias"]],
      cols:["Colaborador","Saldo","1º período","Dias","2º período","Dias","Provisão (R$)"],
      linhas:rows.map(r=>{const e=MEU_QUADRO.find(x=>x.nome===r.colab);
        return [r.colab,(r.saldo||0)+" dias",r.p1?MESES[r.p1-1]:"—",String(r.d1||0),
          r.p2?MESES[r.p2-1]:"—",String(r.d2||0),
          fmtR((e?e.sal:3400)/30*((r.d1||0)+(r.d2||0))*1.3333)];}),
      total:["Total","","","","","",fmtR(prov)],
      link:["Abrir a grade de Férias","wf-ferias"]};
  }
  /* Quadro / Efetivo */
  const dec=st.coleta.decisoes;
  const linhas=MEU_QUADRO.map(e=>{const d=dec[e.mat],ef=efeitoDecisao(e,d);
    return [e.mat,e.nome,FUNCOES[e.func].nome,DECISOES[d.d]||"—",d.mes?MESES[d.mes-1]:"—",
      fmtR(e.sal),ef?fmtR(ef.novo):"—",ef?sgn(ef.delta):"—",d.obs||"—"];});
  const dMensal=MEU_QUADRO.reduce((s,e)=>{const ef=efeitoDecisao(e,dec[e.mat]);return s+(ef?ef.delta:0);},0);
  const desl=Object.values(dec).filter(d=>d.d==="desligar").length;
  return {cards:[["Posições",String(MEU_QUADRO.length)],["Movimentações",String(Object.values(dec).filter(d=>["promover","reconhecer","desligar","substituir"].includes(d.d)).length)],
      ["Impacto mensal",sgn(dMensal)],["Impacto anual",sgn(dMensal*12)]],
    cols:["Matrícula","Colaborador","Função","Tipo","Mês","Salário atual","Salário novo","Δ R$","Observação"],
    linhas,total:["Total ("+desl+" desligamento(s))","","","","","",""," "+sgn(dMensal),""],
    link:["Abrir o Quadro / Efetivo","quadro"]};
}

/* ---------- Dashboard executivo — espelho da página "Comparativo" do PBI real ---------- */
function vDashboard(){
  const st=Store.get(), cen=Engine.oficial(), res=Engine.custo(cen), t26=Engine.custo(null);
  const NOISE=[.985,1.012,.996,1.021,1.008,.988,1.016];
  const realizadoM=NOISE.map((n,i)=>res.mensal[i]*n);
  const realizado=realizadoM.reduce((a,b)=>a+b,0);
  const orcadoYTD=res.mensal.slice(0,7).reduce((a,b)=>a+b,0);
  const varR=orcadoYTD-realizado, varP=varR/Math.max(1,orcadoYTD)*100;
  const fDir=F("dash","dir"), fConta=F("dash","conta");
  /* 5ª rodada · auditoria: estes três eram decorativos. Agora filtram de verdade. */
  const fGrupo=F("dash","grupo"), fTipo=F("dash","tipo"), fMes=F("dash","mes");
  const mesIdx=fMes?MESES.indexOf(fMes):-1;
  /* split por Tipo (Ativos / Novos / Temporários) — donut do Comparativo */
  const semMov={toggles:Object.assign({},cen.toggles,{vagas:false,temp:false})};
  const ativos=Engine.custo(semMov).total;
  const semTemp={toggles:Object.assign({},cen.toggles,{temp:false})};
  const novos=Math.max(0,Engine.custo(semTemp).total-ativos);
  const temps=Math.max(0,res.total-ativos-novos);
  const segs=[["Ativos",ativos,"var(--s1)"],["Novos",novos,"var(--s2)"],["Temporários",temps,"var(--s3)"]];
  let acc=0; const conic=segs.map(([n,v,c])=>{const de=acc/res.total*360;acc+=v;
    /* com Tipo filtrado, os demais segmentos ficam esmaecidos — o donut acompanha o slicer */
    const cor=(!fTipo||fTipo===n)?c:"var(--line)";
    return cor+" "+de.toFixed(1)+"deg "+(acc/res.total*360).toFixed(1)+"deg";}).join(",");
  /* matriz por conta contábil (de-para verba → conta SAP) */
  const TODAS=[...VERBAS,...(st.verbas.extras||[])];
  const porConta={};
  TODAS.filter(v=>st.verbas.ativas[v.id]!==false).forEach(v=>{
    /* mês selecionado usa o valor daquele mês; senão o ano — sempre × recorte (grupo/tipo) */
    const bruto=mesIdx>=0?(res.porVerba[v.id]?.[mesIdx]||0):(res.verbaTotal[v.id]||0);
    const gl=contaDe(v);   /* de-para do cliente manda: remapear a conta move o valor nesta matriz */
    porConta[gl]=(porConta[gl]||0)+bruto;});
  const desvios=CCS.map((c,i)=>({c,d:[1.4,-2.1,3.2,-.8,2.4,-1.2,.6,-.4][i]}))
    .filter(({c})=>!fDir||DIRS[c.dir].nome.replace("Diretoria ","")===fDir)
    .filter(({c})=>!fGrupo||GRUPO_GER[c.id]===fGrupo)
    .sort((a,b)=>Math.abs(b.d)-Math.abs(a.d));
  /* recorte ativo: os KPIs passam a refletir grupo gerencial, tipo e mês */
  const ccsNoRecorte=CCS.filter(c=>(!fDir||DIRS[c.dir].nome.replace("Diretoria ","")===fDir)
                                 &&(!fGrupo||GRUPO_GER[c.id]===fGrupo));
  const fatorCC=ccsNoRecorte.reduce((s,c)=>s+res.porCC[c.id],0)/Math.max(1,CCS.reduce((s,c)=>s+res.porCC[c.id],0));
  const fatorTipo=fTipo?(({Ativos:ativos,Novos:novos,"Temporários":temps})[fTipo]||0)/Math.max(1,res.total):1;
  const recorte=fatorCC*fatorTipo;
  const orcRec=mesIdx>=0?res.mensal[mesIdx]*recorte:res.total*recorte;
  const realRec=mesIdx>=0?(realizadoM[mesIdx]??0)*recorte:realizado*recorte;
  const varRec=(mesIdx>=0?orcRec:orcadoYTD*recorte)-realRec;
  const varPRec=varRec/Math.max(1,(mesIdx>=0?orcRec:orcadoYTD*recorte))*100;
  const filtrosAtivos=[fDir&&"Diretoria "+fDir,fGrupo,fTipo,fMes&&fMes+"/27",fConta&&"conta "+fConta].filter(Boolean);
  return `<div class="page-head"><div><div class="eyebrow">Fase 6 · Análise (Comparativo)</div>
    <h1>Dashboard executivo</h1><p>Orçado × realizado contábil, por tipo, conta e centro — espelho do Comparativo do relatório atual. ${pin(3,"analise")} ${pin(4,"analise")}</p></div>

    ${st.publicado?badge("Orçamento 2027 publicado","b-ok"):badge("Pré-publicação","b-warn")}</div>

      ${["Diretoria: todas","de Operações","Técnica","Administrativa"].map((o,i)=>`<option value="${i?o:""}" ${fDir===o?"selected":""}>${o}</option>`).join("")}</select>
    <select class="filt" aria-label="Conta" onchange="A.filtro('dash','conta',this.selectedIndex?this.value:'')">
      ${["Conta: todas",...Object.keys(CONTAS)].map((o,i)=>`<option value="${i?o:""}" ${fConta===o?"selected":""}>${i?o+" · "+CONTAS[o]:o}</option>`).join("")}</select>
    <select class="filt" aria-label="Grupo gerencial" onchange="A.filtro('dash','grupo',this.selectedIndex?this.value:'')">
      ${["Grupo gerencial: todos","Mina","Beneficiamento","Corporativo"].map((o,i)=>`<option value="${i?o:""}" ${fGrupo===o?"selected":""}>${o}</option>`).join("")}</select>
    <select class="filt" aria-label="Tipo" onchange="A.filtro('dash','tipo',this.selectedIndex?this.value:'')">
      ${["Tipo: todos","Ativos","Novos","Temporários"].map((o,i)=>`<option value="${i?o:""}" ${fTipo===o?"selected":""}>${o}</option>`).join("")}</select>
    <select class="filt" aria-label="Mês" onchange="A.filtro('dash','mes',this.selectedIndex?this.value:'')">
      ${["Mês: todos",...MESES].map((o,i)=>`<option value="${i?o:""}" ${fMes===o?"selected":""}>${o}</option>`).join("")}</select>
    ${filtrosAtivos.length?`<button class="btn" onclick="A.limparFiltros('dash')">${ic("filter")} Limpar (${filtrosAtivos.length})</button>`:""}
  </div>
  ${filtrosAtivos.length?`<div class="note" style="margin-bottom:14px">${ic("filter")}<span>Recorte ativo:
    <b>${esc(filtrosAtivos.join(" · "))}</b> — os indicadores abaixo já refletem esse filtro.</span></div>`:""}
  <div class="grid g4">
    ${kpi(mesIdx>=0?"Orçado "+fMes+"/27":"Total orçado 2027",fmtMi(orcRec),
      filtrosAtivos.length?"recorte de "+fmtPct(recorte*100,0)+" do total":sgn(res.total-t26.total)+" vs 2026")}
    ${kpi(mesIdx>=0?"Realizado "+fMes:"Realizado (jan–jul)",fmtMi(realRec),"razão contábil da folha")}
    ${kpi("Var (R$)"+(mesIdx>=0?" no mês":" YTD"),sgn(varRec),"orçado − realizado",varRec<0?"up":"down")}
    ${kpi("Var (%)"+(mesIdx>=0?" no mês":" YTD"),fmtPct(varPRec),"meta: dentro de ±2%",Math.abs(varPRec)>2?"up":"down")}
  </div>
  <div class="grid g23" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Orçado × Realizado — mensal</h3></div><div class="cb">
      ${barsChart({series:[
        {nome:"Orçado",cor:"var(--s2)",vals:res.mensal.map((v,i)=>mesIdx<0||i===mesIdx?v*recorte:null)},
        {nome:"Realizado",cor:"var(--s1)",vals:MESES.map((_,i)=>i>6?null:(mesIdx<0||i===mesIdx?realizadoM[i]*recorte:null))},
      ],labels:MESES,aria:"Orçado versus realizado por mês"})}
      ${mesIdx>=0?`<p class="muted" style="font-size:11px">Isolado em <b>${fMes}/27</b> — limpe o filtro de mês para ver o ano inteiro.</p>`:""}
    </div></div>
    <div class="card"><div class="ch"><h3>Custo por tipo</h3></div><div class="cb" style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">

      </div>
    </div></div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><div class="ch"><h3>Por conta contábil</h3><span class="spacer"></span><span class="muted" style="font-size:11px">de-para verba → conta SAP</span></div>
      <div class="cb tight"><div class="tblwrap"><table class="tbl">

   Drawer contextual, roteirizado (o protótipo é offline).
   Chips mudam com a rota; algumas respostas EXECUTAM ações.

const COP_CHIPS={
  cenarios:[["Simular corte de 5% em benefícios"],["Onde estourou o teto?"],["Compare este cenário com o baseline"]],
  "resultado-hc":[["Onde o headcount mais cresce?"],["Quais movimentos pesam mais?"]],
  "resultado-custo":[["Explique a variação vs 2026"],["Quais verbas mais mudaram?"],["Onde estourou o teto?"]],
  "wf-pdi":[["Sugerir um PDI para a minha equipe"],["Quanto já comprometi de PDI?"]],
  quadro:[["Quem está pronto para promoção?"],["Qual o impacto das minhas decisões?"]],
  dashboard:[["Leia este orçamento para mim"],["Onde estão os maiores desvios?"]],
  verbas:[["Quais verbas estão incoerentes?"],["O que é uma verba genérica?"],["De onde vem o número desta verba?"]],
  parametros:[["Para que serve uma variável de cálculo?"],["Quais variáveis estão incompletas?"]],
  bases:[["As bases casam?"],["O que muda se eu reimportar o quadro?"]],
  aprovacao:[["O que está travado na cadeia?"],["Resuma o que espera por mim"]],
};
const COP_PADRAO=[["Como está o orçamento 2027?"],["O que falta para fechar o ciclo?"],["Simular corte de 5% em benefícios"]];
function copResponder(t){
  const q=norm(t), st=Store.get();
  const oficial=Engine.oficial(), res=Engine.custo(oficial), b26=Engine.custo(null);
  const dpct=(res.total/b26.total-1)*100;
  const R=(txt,acoes)=>({u:false,txt,acoes:acoes||null});
  /* --- ações executáveis --- */
  const mCorte=q.match(/(corte|cortar|reduzir|reduz)[^\d]*(\d+)\s*%/);
  if(mCorte||/simular corte/.test(q)){
    const pct=mCorte?parseInt(mCorte[2]):5;
    const prova={...oficial,ajustes:{...(oficial.ajustes||{}),benef:-pct}};
    const novo=Engine.custo(prova);
    return R(`Simulei um corte de <b>${pct}%</b> nos benefícios per capita sobre <b>${esc(oficial.nome)}</b>:<br>
      custo passa de <b>${fmtMi(res.total)}</b> para <b>${fmtMi(novo.total)}</b> (${sgn(novo.total-res.total)}),
      e a variação vs 2026 cai de ${fmtPct(dpct)} para <b>${fmtPct((novo.total/b26.total-1)*100)}</b>.`,
      [["Criar este cenário","A.copCriarCenario("+pct+")"],["Abrir Cenários","A.go('cenarios')"]]);
  }
  if(/pdi|desenvolvimento|treinamento/.test(q)&&/suger|propor|ideia|ajud/.test(q))
    return R(`Olhando a sua equipe: <b>Marta Luz</b> está há 3 anos na mesma faixa e é a única técnica com histórico de
      substituir a supervisão. Sugiro <b>Formação de liderança</b>, R$ 4.800 — cabe no que sobra do PDI da área.`,
      [["Adicionar ao PDI","A.copPdi()"],["Abrir a grade","A.go('wf-pdi')"]]);
  /* --- leituras --- */
  if(/teto|estour|guardrail/.test(q)){
    const acima=CCS.map(c=>({c,v:res.porCC[c.id]/Math.max(1,b26.porCC[c.id])-1}))
      .filter(x=>x.v*100>st.ciclo.premissas.teto).sort((a,b)=>b.v-a.v);
    return R(acima.length
      ?`O teto do ciclo é <b>${fmtPct(st.ciclo.premissas.teto,0)}</b>. Estouraram: ${acima.slice(0,3).map(x=>`<b>${x.c.id}</b> (${fmtPct(x.v*100)})`).join(", ")}.
        No consolidado, o ciclo está em <b>${fmtPct(dpct)}</b>.`
      :`Ninguém estourou o teto de <b>${fmtPct(st.ciclo.premissas.teto,0)}</b>. O consolidado está em <b>${fmtPct(dpct)}</b>.`,
      [["Ver resultado de custo","A.go('resultado-custo')"]]);
  }
  if(/verba/.test(q)&&/incoer|errad|problem|conform/.test(q)){
    const c=Engine.conformidade(oficial);
    return R(c.length?`Encontrei <b>${c.filter(x=>x.sev==="erro").length} erro(s)</b> e <b>${c.filter(x=>x.sev==="aviso").length} aviso(s)</b>.
      O mais grave: ${esc(c[0].regra)} — ${esc(c[0].item)}.`:"Nenhuma incoerência nas verbas ativas deste cenário.",
      [["Abrir Conformidade","A.go('conformidade')"]]);
  }
  if(/generica|genérica|ancora|âncora/.test(q))
    return R(`Uma verba <b>genérica</b> não tem pessoa: ela é lançada em <b>centro de resultado + conta contábil</b>
      (base própria), e não rateada por headcount. Hoje são ${VERBAS.filter(v=>ancoraDe(v)==="generica").length}:
      ${VERBAS.filter(v=>ancoraDe(v)==="generica").map(v=>esc(v.nome)).join(", ")} — <b>${fmtMi(res.totGenerica)}</b> no ano.`,
      [["Abrir verbas","A.go('verbas')"]]);
  /* 6ª rodada — o copiloto sabe explicar a procedência e o cadastro de variáveis */
  if(/de onde|procedenc|procedênc|fluxo mandat|origem/.test(q)){
    const v=[...VERBAS,...(st.verbas.extras||[])].find(x=>x.id===UI.verbaSel)||VERBAS[4];
    const fo=fonteDe(v), vars=Engine.varsPorVerba()[v.id]||[];
    return R(`<b>${esc(v.nome)}</b> segue a mesma cadeia de toda verba:<br>
      1 · base <b>${esc(st.bases[fo.base]?.nome||fo.base)}</b> → 2 · vínculo <b>${esc(fo.campo)}</b> →
      3 · ${vars.length?"variável <b>"+esc(vars[0].chave)+"</b>":"valor único do cadastro"} →
      4 · verba → 5 · conta <b>${esc(contaDe(v))}</b>.<br>
      Sem a base declarada ela não calcula — e a Conformidade acusa.`,
      [["Ver a cadeia na verba","A.go('verbas')"],["Abrir a base","A.baseVer('"+fo.base+"')"]]);
  }
  if(/vari.vel|variaveis|variáveis|cct|act|parametr/.test(q)){
    const ps=(st.parametros||[]).filter(p=>p.ativa!==false);
    const incompletas=ps.filter(p=>dimDe(p.dim).membros().some(([k])=>p.vals[k]==null));
    return R(`Uma variável é <b>um valor que muda por dimensão</b> — é assim que CCT e ACT entram sem tela nova.
      Hoje há <b>${ps.length}</b> ativa(s) cobrindo ${new Set(ps.flatMap(p=>p.verbas||[])).size} verba(s).
      ${incompletas.length?`<b>${incompletas.length}</b> com membro sem valor: ${incompletas.map(p=>esc(p.nome)).join(", ")} — nesses o motor cai no valor global.`
        :"Todas cobrem a dimensão inteira."}`,
      [["Abrir variáveis","A.go('parametros')"]]);
  }
  if(/base/.test(q)&&/casa|casam|consist|check/.test(q)){
    const ck=Engine.checkBases(), f=ck.filter(x=>!x.ok).length;
    return R(f?`<b>${f}</b> das ${ck.length} verificações estão falhando — o ciclo não deveria abrir assim.`
      :`As <b>${ck.length}</b> verificações cruzadas passaram: funções, sindicatos, reajustes, centros de resultado e contas casam.`,
      [["Ver o check final","A.checkFinal()"]]);
  }
  if(/reimport|reimportar|impacto|atualizar a base/.test(q))
    return R(`Reimportar uma base já em uso recalcula os <b>${st.cenarios.length} cenários</b>, invalida a rodagem atual
      e pode mudar itens em aprovação. A versão antiga não é apagada — mas os resultados mudam.`,
      [["Abrir bases","A.go('bases')"]]);
  if(/headcount|quadro|posic|posiç/.test(q)){
    const hc=Engine.quadroMensal(oficial).reduce((s,r)=>s+r.qtd[11],0);
    const movs=Engine.movimentos(oficial);
    const top=[...movs].sort((a,b)=>Math.abs(b.qtd)-Math.abs(a.qtd))[0];
    return R(`No cenário <b>${esc(oficial.nome)}</b>: <b>${fmtInt(hc)}</b> posições em dez/27 (baseline 1.284),
      com ${movs.length} movimentos. O maior é ${top?`<b>${top.qtd>0?"+":""}${top.qtd}</b> em ${top.cc} (${esc(FUNCOES[top.func].nome)})`:"—"}.`,
      [["Resultado de headcount","A.go('resultado-hc')"]]);
  }
  if(/promo|promov|pront/.test(q)){
    const cand=MEU_QUADRO.filter(e=>cargosDestino(e.func).length&&st.coleta.decisoes[e.mat].d==="manter").slice(0,3);
    return R(`Candidatos naturais na sua equipe (têm cargo acima na trilha e estão marcados como Manter):
      ${cand.map(e=>`<b>${esc(e.nome)}</b> → ${esc((cargosDestino(e.func)[0]||[])[1]?.nome||"—")}`).join(", ")}.`,
      [["Abrir o Efetivo","A.go('quadro')"]]);
  }
  if(/aprova|cadeia|travad/.test(q)){
    const f=st.aprovacoes.fila, meus=f.filter(a=>a.papel===st.papel);
    const atras=f.filter(a=>a.dias>2);
    return R(`Há <b>${f.length}</b> itens na cadeia, <b>${meus.length}</b> esperando por você
      e <b>${atras.length}</b> acima de 2 dias na etapa.`,[["Abrir aprovações","A.go('aprovacao')"]]);
  }
  if(/falta|fechar o ciclo|proxim|próxim/.test(q)){
    const pend=WORKFLOWS.filter(w=>st.ciclo.wfAtivos[w.id]).filter(w=>!(w.id==="atual"?st.coleta.enviado:st.coleta.wf[w.id]?.enviado)).length;
    return R(`Para fechar: <b>${pend}</b> grade(s) do gestor pendentes, <b>${st.aprovacoes.fila.length}</b> itens na cadeia de aprovação
      e o cenário oficial (<b>${esc(oficial.nome)}</b>) ainda ${st.publicado?"publicado":"não publicado"}.`,
      [["Ver a coleta","A.go('consolidacao')"],["Ver aprovações","A.go('aprovacao')"]]);
  }
  if(/verba/.test(q)&&/mud|vari|maior/.test(q)){
    const top=[...VERBAS].filter(v=>st.verbas.ativas[v.id]!==false)
      .sort((a,b)=>Math.abs((res.verbaTotal[b.id]||0)-(b26.verbaTotal[b.id]||0))-Math.abs((res.verbaTotal[a.id]||0)-(b26.verbaTotal[a.id]||0))).slice(0,3);
    return R(`As que mais mudam vs 2026: ${top.map(v=>`<b>${esc(v.nome)}</b> (${sgn((res.verbaTotal[v.id]||0)-(b26.verbaTotal[v.id]||0))})`).join(", ")}.`,
      [["Resultado de custo","A.go('resultado-custo')"]]);
  }
  if(/desvio|realizado/.test(q))
    return R(`No acumulado jan–jul, o realizado está dentro de ±2% do orçado. Os maiores desvios por centro são
      OP-DESM (+3,2%) e LOG-FROTA (+2,4%).`,[["Abrir dashboard","A.go('dashboard')"]]);
  if(/compar/.test(q))
    return R(`<b>${esc(oficial.nome)}</b> × baseline 2026: custo <b>${fmtMi(res.total)}</b> contra ${fmtMi(b26.total)}
      (${sgn(res.total-b26.total)}, ${fmtPct(dpct)}); headcount ${fmtInt(res.hc[11])} contra 1.284.`,
      [["Comparar nos Resultados","A.go('resultado-custo')"]]);
  /* leitura geral */
  return R(`O ciclo 2027 está em <b>${fmtMi(res.total)}</b> no cenário oficial (<b>${esc(oficial.nome)}</b>),
    ${fmtPct(dpct)} acima de 2026 — teto de ${fmtPct(st.ciclo.premissas.teto,0)}.
    Headcount projetado de <b>${fmtInt(res.hc[11])}</b> posições em dez/27, com
    ${st.aprovacoes.fila.length} itens ainda na cadeia de aprovação.`,
    [["Resultado de custo","A.go('resultado-custo')"],["Cenários","A.go('cenarios')"]]);
}

/* ---------- Ações ---------- */
const A={
  go(r){r=REDIR[r]||r;ROUTE=r;location.hash=r;render();},
  cmp(lado,v){UI["cmp"+lado]=v;render();},
  papel(p){Store.patch(s=>s.papel=p);
    if(!rotaPermitida(p,ROUTE)){ROUTE="home";location.hash="home";}
    render();},
  premSave(el){Store.patch(s=>{s.conteudo.premissas=el.innerHTML
      .replace(/<img[^>]*>/g,"");});toast("Premissas salvas");},
  premImg(inp){const f=inp.files&&inp.files[0];if(!f)return;
    const rd=new FileReader();
    rd.onload=()=>{try{Store.patch(s=>s.conteudo.img=rd.result);toast("Imagem publicada nas premissas");render();}
      catch(e){toast("Imagem grande demais para o armazenamento local do protótipo");}};
    rd.readAsDataURL(f);},
  premReset(){Store.patch(s=>{const seed=Store.seedConteudo();s.conteudo=seed;});toast("Premissas restauradas");render();},
  wfCell(id,i,k,v){Store.patch(s=>s.coleta.wf[id].rows[i][k]=v);},
  wfAdd(id){Store.patch(s=>s.coleta.wf[id].rows.push(Object.assign({},WFFILL[id].novo)));render();},
  wfRm(id,i){Store.patch(s=>s.coleta.wf[id].rows.splice(i,1));render();},
  wfEnviar(id){const temAprov=Store.get().workflow.cadeias[id].length>0;
    Store.patch(s=>s.coleta.wf[id].enviado=true);
    toast(temAprov?"Enviado para aprovação — v1 imutável criada":"Consolidado direto no RH (workflow sem aprovação)");render();},
  wfReabrir(id){Store.patch(s=>s.coleta.wf[id].enviado=false);
    toast("Reaberto para revisão — a versão enviada fica no histórico");render();},
  /* ---- Bases: import wizard (Upload → Revisão → Confirmação) + histórico/rollback ---- */
  impAbrir(tipo){UI.imp={tipo,step:0,novas:0,alt:0,ign:0,err:0,warn:0,arquivo:null};A.impModal();},
  impModal(){

  decidirAp(id,acao,obs){
    const quem=AP_PAPEL_NOME[Store.get().papel]||"—";
    let msg="";
    Store.patch(s=>{
      const i=s.aprovacoes.fila.findIndex(a=>a.id===id);if(i<0)return;
      const ap=s.aprovacoes.fila[i];
      if(acao==="aprovado"&&ap.etapa<ap.etapas.length){ /* avança a coluna do kanban */
        ap.etapa++;ap.dias=0;
        const prox=(ap.etapas[ap.etapa-1]||"").toLowerCase();
        ap.papel=prox.includes("cfo")||prox.includes("financeiro")?"pc":prox.includes("gestor")?"gestor":"rh";
        msg="Aprovado — avançou para "+ap.etapas[ap.etapa-1];
        return;
      }
      s.aprovacoes.fila.splice(i,1);
      s.aprovacoes.hist.unshift({ref:ap.ref,acao,por:quem,em:"hoje",obs:obs||""});
      if(acao==="aprovado"&&ap.tipo==="Cenário de custo"){s.publicado=true;
        s.ciclo.cronograma.find(c=>c.id==="custo").status="done";
        s.ciclo.cronograma.find(c=>c.id==="analise").status="done";
        msg="Aprovado na última etapa — orçamento 2027 publicado";}
      else msg=acao==="aprovado"?"Aprovado — concluído":"Devolvido com comentário — o dono foi notificado";});
    closeModal();toast(msg||"Item atualizado");render();},

        Os <b>campos customizados</b> são seus e entram no modelo do próximo import.</span></div>
    </div>
    <div class="mf"><button class="btn btn-primary" onclick="closeModal();toast('Campos customizados salvos — valem do próximo import')">Salvar campos</button></div>`);},
  colAddCustom(tipo){Store.patch(s=>s.bases[tipo].cols.push({n:"Novo campo",t:"texto",custom:true,eixo:""}));A.baseCampos(tipo);},
  colRmCustom(tipo,i){Store.patch(s=>s.bases[tipo].cols.splice(i,1));A.baseCampos(tipo);},
  /* CTA de integração — contextual (6ª rodada). O princípio não muda: nada aqui é pré-requisito. */
  integraRhn(ctx){
    const st=Store.get();
    const CTX={
      reajustes:{tit:"Convenções e dissídios",
        int:"Digitar o % e a data-base de cada sindicato funciona sempre. Com a integração, as convenções chegam do módulo de relações sindicais — já com data-base, cláusulas e histórico de negociação.",
        linhas:[["Reajustes (data-base)","Digitado na configuração","% e data-base por convenção"],
                ["Sindicato","Upload manual","Alíquotas e fatores atualizados"],
                ["Filiais / unidades","Upload manual","Estabelecimentos do cadastro"]]},
      acessos:{tit:"Usuários e hierarquia",
        int:"Convidar um a um funciona. Com a integração, os usuários, o gestor imediato e o centro de custo de cada pessoa vêm do cadastro — e continuam batendo quando alguém muda de área no meio do ciclo.",
        linhas:[["Usuários do ciclo","Convite manual","Provisionamento automático"],
                ["Gestor imediato por CC","Amarrado à mão","Hierarquia do cadastro"],
                ["Perfis de acesso","Definidos aqui","Mapeados por cargo/área"]]},
      situacoes:{tit:"Situação dos colaboradores",
        int:"Hoje a situação de cada pessoa é a foto da base importada (30/06/2026). Com a integração, afastamento, licença, férias em curso e desligamento chegam do dia — o gestor não decide sobre gente que já saiu ou já voltou.",
        linhas:[["Afastamentos e licenças","Foto da base de quadro","Situação do dia"],
                ["Admissões e desligamentos","Foto da base de quadro","Movimento diário"],
                ["Saldo e vencimento de férias","Coluna importada","Período aquisitivo em tempo real"]]},
    };
    const c=CTX[ctx]||{tit:"Bases do ciclo",
      int:"O RH Budget funciona sem nenhuma integração: subir o arquivo é o caminho completo de toda base. Se a sua empresa já usa o ecossistema RH Numbers, dá para trocar o upload manual por uma carga automática.",
      linhas:["quadro_pessoal","posicoes","horas_extras","plano_saude","custo_cr_conta"]
        .map(id=>{const b=st.bases[id];return [b.nome,"Upload manual · v"+b.v,"Carga diária automática"];})};
    modal(`<div class="mh"><span style="width:26px;height:26px;border-radius:50%;background:var(--grad-ia);flex:none"></span>
      <h3>Integração RH Numbers — ${esc(c.tit)}</h3></div>
    <div class="mb">
      <p style="font-size:13px;margin-bottom:12px">${esc(c.int)}</p>
      <div class="tblwrap" style="border:1px solid var(--line);border-radius:12px"><table class="tbl">
        <thead><tr><th>O quê</th><th>Como é hoje</th><th>Com integração</th></tr></thead>
        <tbody>${c.linhas.map(l=>`<tr><td><b>${esc(l[0])}</b></td><td class="muted">${esc(l[1])}</td>
          <td>${badge(l[2],"b-brand")}</td></tr>`).join("")}</tbody></table></div>
      <div class="note" style="margin-top:12px">${ic("alert")}<span>Nada aqui é obrigatório. Sem integração, o ciclo roda
        exatamente igual — só com import por arquivo. A plataforma <b>não bloqueia nenhuma tela</b> por falta de integração.</span></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">Agora não</button>
      <button class="btn btn-primary" onclick="closeModal();toast('Interesse registrado — o time RH Numbers entra em contato (demo)')">Quero conhecer</button></div>`);},
  checkFinal(){
    const itens=Engine.checkBases(), falhas=itens.filter(i=>!i.ok).length;
    modal(`<div class="mh">${ic("check")}<h3>Check final — as bases casam?</h3></div>
    <div class="mb">
      <p class="muted" style="font-size:12.5px;margin-bottom:12px">Validações cruzadas entre as bases do ciclo.
        O ciclo só abre com tudo verde — é o último passo do Fluxo.</p>
      ${itens.map(i=>`<div class="check ${i.ok?"ok":""}">
        <span class="ci" style="${i.ok?"":"background:var(--bad-bg);border-color:transparent;color:var(--bad)"}">${i.ok?"✓":"!"}</span>
        <div style="flex:1"><b style="font-size:12.5px">${esc(i.titulo)}</b>
          <div class="cd">${i.detalhe}</div></div>
        <span class="muted num" style="font-size:11.5px">${fmtInt(i.n)}</span></div>`).join("")}
      <div class="${falhas?"impacto":"note"}" style="margin-top:12px">${ic(falhas?"alert":"check")}<span>
        ${falhas?`<b>${falhas} verificação(ões) falhando</b> — corrija antes de abrir o ciclo.`
          :`<b>Tudo casa.</b> As ${itens.length} verificações passaram: o ciclo pode ser aberto.`}</span></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" ${falhas?"disabled":""} onclick="closeModal();toast('Ciclo 2027 liberado — bases consistentes')">${ic("play")} Liberar o ciclo</button></div>`);},
  /* aviso de impacto: editar base já em uso pelo ciclo */
  impImpacto(tipo){
    const st=Store.get(), b=st.bases[tipo];
    if(!st.basesEmUso.includes(tipo))return "";
    return `<div class="impacto">${ic("alert")}<span><b>Esta base já está em uso pelo ciclo 2027.</b>
      Publicar uma versão nova recalcula o custo de <b>${st.cenarios.length} cenário(s)</b>,
      invalida a rodagem atual e pode mudar itens que já estão em aprovação.
      A v${b.v} continua no histórico — nada é apagado, mas os resultados mudam.</span></div>`;},

  /* ---------- Organograma ---------- */
  orgToggle(id){UI.orgOpen=UI.orgOpen||{};UI.orgOpen[id]=!UI.orgOpen[id];render();},
  orgTodos(on){UI.orgOpen={};
    const walk=n=>{UI.orgOpen[n.id]=on;(n.filhos||[]).forEach(walk);};
    Engine.organograma(Engine.cenPorId(UI.orgCen)||Engine.oficial()).filhos.forEach(walk);render();},
  orgCen(id){UI.orgCen=id;render();},

  /* ---------- Notificações ---------- */
  ntfLerTodas(){Store.patch(s=>s.notificacoes.forEach(n=>n.lida=true));toast("Notificações marcadas como lidas");render();},
  ntfIr(id){const n=Store.get().notificacoes.find(x=>x.id===id);
    Store.patch(s=>{const y=s.notificacoes.find(x=>x.id===id);if(y)y.lida=true;});
    document.getElementById("sinoPanel").classList.remove("open");
    document.getElementById("scrim").classList.remove("show");
    A.go(n?.rota||"home");},
  ntfEmail(id){const n=Store.get().notificacoes.find(x=>x.id===id);if(!n)return;
    modal(`<div class="mh">${ic("doc")}<h3>Prévia do e-mail</h3></div>
    <div class="mb">
      <div class="tblwrap" style="border:1px solid var(--line);border-radius:10px;margin-bottom:12px"><table class="tbl"><tbody>
        <tr><td style="width:90px" class="muted">De</td><td>RH Budget · Aurora Mineração &lt;nao-responda@aurora.example&gt;</td></tr>
        <tr><td class="muted">Para</td><td>${esc(WHO[Store.get().papel].split(" · ")[0])}</td></tr>
        <tr><td class="muted">Assunto</td><td><b>[Orçamento 2027] ${esc(n.tit)}</b></td></tr>
      </tbody></table></div>
      <div class="freedoc" style="padding:18px 20px;font-size:13px">
        <p>Olá,</p><p>${esc(n.txt)}</p>
        <p>Acesse o RH Budget para resolver: <a href="#${n.rota}">abrir no sistema</a>.</p>
        <p class="muted" style="font-size:11.5px">Você recebe este aviso porque participa do ciclo 2027.</p></div>
    </div>
    <div class="mf"><button class="btn" onclick="closeModal()">Fechar</button>
      <button class="btn btn-primary" onclick="closeModal();toast('E-mail reenviado (demo)')">${ic("send")} Reenviar</button></div>`);},
  ntfRegra(i){toast("Regra de disparo alterada — vale para os próximos eventos do ciclo");},

  /* ---------- Copiloto RH Numbers (roteirizado — propõe e executa) ---------- */
  copAbrir(prompt){
    const d=document.getElementById("copiloto"),sc=document.getElementById("scrim");
    d.classList.add("open");sc.classList.add("show");renderCop();
    if(prompt){document.getElementById("copIn").value=prompt;A.copEnviar();}
    else setTimeout(()=>document.getElementById("copIn")?.focus(),150);},
  copLimpar(){UI.cop=[];renderCop();},
  copChip(t){document.getElementById("copIn").value=t;A.copEnviar();},
  copEnviar(){
    const inp=document.getElementById("copIn");
    const t=(inp.value||"").trim(); if(!t)return;
    inp.value="";
    UI.cop=UI.cop||[];
    UI.cop.push({u:true,txt:t});
    UI.cop.push(copResponder(t));
    renderCop();},
  /* ações que o copiloto executa de verdade */
  copCriarCenario(pct){
    const oficial=Engine.oficial();
    const id="cen-ia"+(Store.get().cenarios.length+1);
    Store.patch(s=>s.cenarios.push({id,nome:"Corte de "+Math.abs(pct)+"% em benefícios",oficial:false,status:"rascunho",
      origem:"Criado pelo Copiloto a partir de "+oficial.nome,
      toggles:{...oficial.toggles},extras:(oficial.extras||[]).map(m=>({...m})),
      ajustes:{benef:-Math.abs(pct)},delta:{...oficial.delta},verbaAj:{},linhas:null,
      just:"Simulação de corte de "+Math.abs(pct)+"% nos benefícios per capita, pedida pelo copiloto."}));
    UI.cenSel=id;
    UI.cop.push({u:false,txt:`Cenário <b>Corte de ${Math.abs(pct)}% em benefícios</b> criado e salvo. Ele está na lista de Cenários, como rascunho.`,
      acoes:[["Abrir em Cenários","A.go('cenarios')"]]});
    renderCop();toast("Cenário criado pelo copiloto");render();},
  copPdi(){
    const alvo=MEU_QUADRO.find(e=>Store.get().coleta.decisoes[e.mat].d==="reconhecer")||MEU_QUADRO[7];
    Store.patch(s=>{s.coleta.wf.pdi.rows.push({tipo:"Formação de liderança",
      descr:"Trilha de liderança para preparar sucessão na supervisão",colab:alvo.nome,inv:4800});});
    UI.cop.push({u:false,txt:`Sugestão adicionada à grade de PDI: <b>Formação de liderança</b> para <b>${esc(alvo.nome)}</b>, R$ 4.800.`,
      acoes:[["Abrir o PDI","A.go('wf-pdi')"]]});
    renderCop();toast("Sugestão de PDI adicionada");render();},

};

/* ---------- Boot ---------- */
(function boot(){
  const hash=REDIR[location.hash.replace("#","")]||location.hash.replace("#","");
  if(ROUTES[hash])ROUTE=hash;
  window.addEventListener("hashchange",()=>{const raw=location.hash.replace("#","");
    const h=REDIR[raw]||raw;
    if(ROUTES[h]&&h!==ROUTE){ROUTE=h;if(h!==raw)location.hash=h;render();}});
  document.getElementById("menuBtn").onclick=()=>document.getElementById("app").classList.toggle("nav-open");
  document.getElementById("btnReset").onclick=()=>{Store.reset();UI.cfgStep=0;
    UI.custoLog=[];UI.custoDone=false;UI.apMinhas=false;ROUTE="home";
    UI.selMat=[];UI.blkOpen={};UI.orgOpen={};UI.cop=[];UI.cmpA=null;UI.cmpB=null;
    UI.cenSel="base";UI.tmp=null;UI.f={};UI.sort={};
    toast("Demo restaurado ao estado inicial");render();};
  const rot=document.getElementById("roteiro"),obsP=document.getElementById("obsPanel"),scrim=document.getElementById("scrim");
  const sinoP=document.getElementById("sinoPanel"),copP=document.getElementById("copiloto");
  document.getElementById("btnRoteiro").onclick=()=>{renderRoteiro();rot.classList.add("open");scrim.classList.add("show");};
  document.getElementById("roteiroClose").onclick=()=>{rot.classList.remove("open");scrim.classList.remove("show");};
  document.getElementById("obsClose").onclick=()=>{obsP.classList.remove("open");scrim.classList.remove("show");};
  document.getElementById("btnSino").onclick=()=>{renderSino();sinoP.classList.add("open");scrim.classList.add("show");};
  document.getElementById("sinoClose").onclick=()=>{sinoP.classList.remove("open");scrim.classList.remove("show");};
  document.getElementById("btnCop").onclick=()=>A.copAbrir();
  document.getElementById("copClose").onclick=()=>{copP.classList.remove("open");scrim.classList.remove("show");};
  scrim.onclick=()=>{[rot,obsP,sinoP,copP].forEach(d=>d.classList.remove("open"));
    scrim.classList.remove("show");closeModal();};
  document.getElementById("modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal();});
  document.getElementById("btnAnnot").onclick=()=>{
    const on=document.body.classList.toggle("annot");
    document.getElementById("btnAnnot").setAttribute("aria-pressed",on);
    if(on){renderObs();obsP.classList.add("open");scrim.classList.add("show");}
    else{obsP.classList.remove("open");scrim.classList.remove("show");}};
  render();
})();
/* fim-app */
</script>
</body>
</html>
