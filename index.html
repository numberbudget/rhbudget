<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RH Budget · Orçamento 2027 — Aurora Mineração</title>
<meta name="description" content="Protótipo navegável do fluxo completo do orçamento de pessoal. Dados ilustrativos para validação de layout.">
<link href="https://fonts.googleapis.com/css2?family=Lexend+Deca:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,300,0,0&display=block" rel="stylesheet">
<style>
/* ============================================================
   RH BUDGET · Protótipo do evento — design do remake rhnumbers-app
   (rhnumbers-prototypes/app/0_remake_rhnumbers, tema rhn).
   Tokens, botões, filtros, tabelas e chrome idênticos ao remake.
   ============================================================ */
:root{
  /* marca (white-label) — tema rhn do remake */
  --brand:#177c7a; --brand-d:#0f5b59; --brand-100:#d2f7f6; --brand-50:#f0fbfb; --brand-rgb:23,124,122;
  --accent:#26cdcb; --accent-d:#1fb0ae;
  /* neutros — app-base.css */
  --ink:#111827; --ink-2:#6b7280; --ink-3:#9ca3af; --line:#eceaf1; --line-2:#f4f3f7;
  --bg:#f5f6f8; --card:#fff; --paper:#fafbfd;
  --ok:#127a4b; --ok-bg:#e6f6ec; --warn:#9a6700; --warn-bg:#fff6db; --warn-ink:#8a5a00;
  --bad:#b42318; --bad-bg:#fdecea; --info:#1F6FBE; --info-bg:#e8f0fe;
  --r-card:18px; --r-grp:16px; --r-ctrl:11px;
  --sh:0 1px 2px rgba(48,46,72,.04),0 1px 4px rgba(48,46,72,.05);
  --sh-lg:0 14px 44px rgba(20,25,35,.15);
  /* aliases usados pelas views (mapeados ao remake) */
  --background:var(--bg); --foreground:var(--ink); --surface:#fff; --surface-2:var(--line-2);
  --muted-foreground:var(--ink-2); --input:var(--line); --ring:var(--brand);
  --primary:var(--brand); --primary-press:var(--brand-d);
  --brand-700:var(--brand);
  --mag-700:var(--brand-d); --teal-50:var(--brand-50); --teal-300:#7fdbd9; --teal-500:var(--accent);
  --s1:#119b97; --s2:#8b2d6a; --s3:#3d63b8; /* séries de gráfico (CVD validadas p/ o universo rhn) */
  --radius-sm:9px; --radius:var(--r-ctrl); --radius-lg:var(--r-grp);
  --shadow-1:var(--sh); --shadow-2:0 6px 18px rgba(20,25,35,.10); --shadow-3:var(--sh-lg);
  --app-font:'Lexend Deca','Inter',system-ui,sans-serif;
  --font-display:var(--app-font);
  --mono:'Inter',ui-monospace,Consolas,monospace;
  --grad-ia:linear-gradient(100deg,var(--brand-d),var(--brand));
  --sidebar-w:256px; --topbar-h:56px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--app-font);background:var(--bg);color:var(--ink);
  font-size:13px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1{font-size:21px;font-weight:600;letter-spacing:.2px} h2,h3{font-weight:600}
a{color:var(--brand);text-decoration:none}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit;font-size:inherit}
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,[contenteditable]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
input[type=checkbox]{accent-color:var(--brand);width:16px;height:16px;cursor:pointer}
::selection{background:var(--brand-100)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#d6d5df;border-radius:8px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;color:var(--ink-3)}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.muted{color:var(--ink-2)}
.mono{font-family:var(--mono);font-size:12px}
.ms{font-family:'Material Symbols Rounded';font-weight:normal;font-style:normal;font-size:19px;
  line-height:1;display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  white-space:nowrap;-webkit-font-smoothing:antialiased;vertical-align:-4px;
  font-variation-settings:'FILL' 0,'wght' 300,'GRAD' 0,'opsz' 24}
.ms.sm{font-size:17px}.ms.lg{font-size:24px}
svg.i{width:17px;height:17px;flex:none;vertical-align:-3px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell (navcol + topbar + pageband — remake) ---------- */
.app{display:grid;grid-template-columns:var(--sidebar-w) 1fr;min-height:100vh}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;
  flex-direction:column;position:sticky;top:0;height:100vh;z-index:30}
.brand{background:var(--brand);color:#fff;padding:16px 18px 40px;position:relative;flex:none}
.brand b{font-weight:700;font-size:16px;line-height:1.1;display:block}
.brand small{display:block;font-weight:500;font-size:12px;opacity:.92;margin-top:2px}
.brand .logo{position:absolute;left:50%;bottom:-26px;transform:translateX(-50%);width:54px;height:54px;
  border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;border:3px solid #fff}
.brand .logo i{width:34px;height:34px;border-radius:50%;background:var(--grad-ia);display:block}
.nav{padding:38px 12px 20px;flex:1;overflow:auto}
.nav .group{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  color:var(--ink-3);padding:16px 12px 6px}
.nav .item{display:flex;align-items:center;gap:13px;padding:9px 12px;width:100%;
  border-radius:11px;color:var(--ink-2);font-weight:500;font-size:13.5px;
  margin-bottom:1px;text-align:left;white-space:nowrap}
.nav .item .ms{font-size:21px;color:var(--ink-3)}
.nav .item:hover{background:var(--brand-50);color:var(--ink)}
.nav .item:hover .ms{color:var(--brand)}
.nav .item.active{background:var(--brand-100);color:var(--brand);font-weight:600}
.nav .item.active .ms{color:var(--brand)}
.sidebar .foot{border-top:1px solid var(--line);padding:9px 12px;background:#fff}
.nav-user{display:flex;align-items:center;gap:11px;padding:8px;border-radius:11px}
.nav-user .av{width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:600;font-size:12px;flex:0 0 auto}
.nav-user .nm{font-size:12.5px;font-weight:600;line-height:1.15}
.nav-user .rl{font-size:10.5px;color:var(--ink-3)}

.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:var(--topbar-h);background:#fff;border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:0 16px;position:sticky;top:0;z-index:20}
.topbar .crumb{font-size:12.5px;color:var(--ink-2);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .crumb b{color:var(--ink)}
.topbar .spacer{flex:1}
.surface-sw{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;align-items:center}
.surface-sw::before{content:"VER COMO";font-size:9px;font-weight:800;color:var(--ink-3);letter-spacing:.6px;padding:0 8px 0 6px}
.surface-sw button{padding:6px 13px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.surface-sw button.on{background:#fff;color:var(--brand);box-shadow:var(--sh)}
.fict{font-size:10.5px;color:var(--ink-3);border:1px solid var(--line);
  border-radius:20px;padding:4px 11px;white-space:nowrap;font-weight:600}
.menu-btn{display:none;width:38px;height:38px;border-radius:10px;color:var(--ink-2);place-items:center}
.menu-btn:hover{background:var(--bg)}
.content{padding:22px 30px 90px;width:100%;margin:0 auto;max-width:1700px}
/* pageband do remake como cabeçalho de página */
.page-head{background:linear-gradient(100deg,var(--brand-d),var(--brand));color:#fff;
  border-radius:var(--r-grp);padding:20px 24px;display:flex;align-items:flex-start;gap:14px;
  margin-bottom:18px;flex-wrap:wrap;box-shadow:var(--sh)}
.page-head h1{font-size:21px;font-weight:600;letter-spacing:.2px}
.page-head p{color:rgba(255,255,255,.92);font-size:13px;margin-top:5px;max-width:760px}
.page-head .eyebrow{color:rgba(255,255,255,.75)}
.page-head .spacer{flex:1}
.page-head .btn{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.page-head .btn:hover{background:rgba(255,255,255,.28);color:#fff}
.page-head .btn-primary,.page-head .btn.primary{background:var(--accent);color:#fff}
.page-head .btn-primary:hover{background:var(--accent-d)}
.page-head .chip{background:rgba(255,255,255,.14);border-color:transparent;color:#fff}
.page-head .muted{color:rgba(255,255,255,.8)}
.page-head .pin{border-color:rgba(255,255,255,.7)}
/* toolbar de filtros — padrão do remake */
.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px;flex-wrap:wrap}
.toolbar .search{position:relative;flex:1;min-width:180px}
.toolbar .search input{width:100%;padding:11px 14px 11px 42px;border:1px solid var(--line);
  border-radius:11px;font-size:13px;background:#fff;font-family:inherit;color:var(--ink)}
.toolbar .search input:focus{outline:none;border-color:var(--brand)}
.toolbar .search .si{position:absolute;left:13px;top:9px;color:var(--ink-3)}
select.filt{padding:10px 34px 10px 14px;border:1px solid var(--line);border-radius:11px;
  font-size:12.5px;font-weight:600;color:var(--ink-2);font-family:inherit;cursor:pointer;
  -webkit-appearance:none;appearance:none;
  background:#fff url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='18' height='18' viewBox='0 0 24 24' fill='none' stroke='%239ca3af' stroke-width='2'%3E%3Cpath d='M6 9l6 6 6-6'/%3E%3C/svg%3E") no-repeat right 11px center}
select.filt:hover,select.filt:focus{border-color:var(--brand);color:var(--brand);outline:none}

/* ---------- Componentes (remake) ---------- */
.btn{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:12.5px;
  padding:10px 16px;border-radius:11px;white-space:nowrap;border:1px solid var(--line);
  background:#fff;color:var(--ink-2)}
.btn:hover{border-color:var(--brand);color:var(--brand)}
.btn .ms{font-size:19px}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-d);border-color:var(--accent-d);color:#fff}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink-2)}
.btn-ghost:hover{border-color:var(--brand);color:var(--brand);background:#fff}
.btn-accent{background:var(--brand);border-color:var(--brand);color:#fff}
.btn-accent:hover{background:var(--brand-d);color:#fff}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger:hover{background:#992015;color:#fff}
.btn-ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn-ok:hover{background:#0e6540;color:#fff}
.btn-warnb{background:#fff;border:1px solid #efd98f;color:var(--warn-ink)}
.btn-warnb:hover{border-color:var(--warn);color:var(--warn-ink)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-grp);box-shadow:var(--sh)}
.card .ch{padding:15px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .ch h3{font-size:13.5px;font-weight:600;letter-spacing:.3px}
.card .ch .spacer{flex:1}
.card .cb{padding:16px}
.card .cb.tight{padding:0}
.grid{display:grid;gap:15px}
.g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g23{grid-template-columns:2fr 1fr}.g32{grid-template-columns:1fr 2fr}
.kpi{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);padding:16px 18px}
.kpi .lbl{font-size:12px;color:var(--ink-3);font-weight:600}
.kpi .val{font-size:26px;font-weight:700;margin-top:3px}
.kpi .delta{font-size:11.5px;font-weight:600;margin-top:2px}
.delta.up{color:var(--bad)} .delta.down{color:var(--ok)} .delta.flat{color:var(--ink-3)}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:3px 9px;border-radius:20px;white-space:nowrap}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-warn{background:var(--warn-bg);color:var(--warn-ink)}
.b-bad{background:var(--bad-bg);color:var(--bad)} .b-info{background:#eef4ff;color:var(--info)}
.b-neutral{background:#f1f0f5;color:var(--ink-3)}
.b-brand{background:var(--brand-100);color:var(--brand)}
.b-ai{background:#fdecf4;color:#b83b68}
.chip{display:inline-flex;align-items:center;gap:7px;background:#fff;
  border:1px solid var(--line);border-radius:20px;padding:8px 13px;font-size:12.5px;font-weight:600}
.chip.on{background:var(--brand-100);border-color:var(--brand);color:var(--brand)}
.chip button{padding:0;font-weight:800}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;
  color:var(--ink-3);font-weight:700;padding:12px 15px;border-bottom:1px solid var(--line);
  background:var(--paper);position:sticky;top:0;z-index:1;white-space:nowrap}
.tbl td{padding:11px 15px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover td{background:var(--brand-50)}
.tbl .num{text-align:right}
.tbl th.num{text-align:right}
.tbl tfoot td{font-weight:700;background:var(--paper);border-top:1px solid var(--line)}
.tblwrap{overflow-x:auto;border-radius:0 0 var(--r-grp) var(--r-grp)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.field .hint{font-size:11.5px;color:var(--ink-3);margin-top:4px}
.input,.select,textarea.input{width:100%;background:#fff;border:1px solid var(--line);
  border-radius:9px;padding:10px 12px;font-size:13px;color:var(--ink);font-family:inherit}
.input:focus,.select:focus{outline:0;border-color:var(--brand)}
.input.mini{width:76px;padding:6px 8px;text-align:right}
.select.mini{width:auto;padding:6px 8px}
.row{display:grid;gap:12px}.row.c2{grid-template-columns:1fr 1fr}.row.c3{grid-template-columns:repeat(3,1fr)}.row.c4{grid-template-columns:repeat(4,1fr)}
/* toggle (tgl do remake) */
.switch{position:relative;width:40px;height:22px;border-radius:22px;background:#d0cfda;transition:.15s;flex:none;padding:0}
.switch.on{background:var(--brand)}
.switch i{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on i{left:20px}
/* wizard (wstep do remake) */
.stepper{display:flex;gap:8px;margin-bottom:22px;flex-wrap:wrap}
.stepper .s{display:flex;align-items:center;gap:9px;padding:9px 14px;border-radius:11px;
  background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-2)}
.stepper .s .n{width:22px;height:22px;border-radius:50%;background:var(--bg);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex:none}
.stepper .s.done .n{background:var(--ok);color:#fff}
.stepper .s.now{border-color:var(--brand);color:var(--brand)}
.stepper .s.now .n{background:var(--brand);color:#fff}
/* inner-tabs do remake */
/* 6ª rodada: o cabeçalho de abas fica fixo — em tabela longa o usuário perdia a referência
   de qual visão estava aberta e precisava rolar de volta para trocar. */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto;flex-wrap:wrap;
  position:sticky;top:var(--topbar-h);z-index:14;background:var(--bg);
  margin:0 -30px 20px;padding:7px 30px 0}
.tabs button{padding:11px 16px;font-size:13px;font-weight:600;color:var(--ink-2);
  border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;display:inline-flex;gap:7px;align-items:center}
.tabs button:hover{color:var(--ink)}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tabs button .ct{font-size:11px;color:var(--ink-3);font-weight:700;background:var(--bg);border-radius:9px;padding:0 6px}
.tabs button.on .ct{background:var(--brand-100);color:var(--brand)}
.bar{height:7px;border-radius:5px;background:var(--line-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:5px;transition:width .3s}
.bar i.acc{background:var(--brand)} .bar i.warn{background:#e0b93a} .bar i.bad{background:var(--bad)}
.note{display:flex;gap:11px;background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:12px;padding:13px 16px;font-size:13px}
.note b{color:var(--brand)}
.note .ms{color:var(--brand)}
.ai-inline{background:#fdf3f9;border:1px solid #f5dcea;border-radius:12px;padding:13px 15px;display:flex;gap:11px;font-size:12.5px}
.ai-inline .tag{font-size:9.5px;font-weight:800;letter-spacing:.06em;color:#b83b68;
  border:1px solid #f0cadd;background:#fff;border-radius:6px;padding:2px 6px;height:fit-content;flex:none;margin-top:1px}
.ai-inline b{color:#b83b68}
.divider{height:1px;background:var(--line);margin:16px 0}
.flex{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}
.wrapf{display:flex;flex-wrap:wrap;gap:8px}
.empty{text-align:center;padding:40px;color:var(--muted-foreground);font-size:13px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--foreground);
  color:#fff;padding:11px 19px;border-radius:10px;font-size:13px;font-weight:600;
  box-shadow:var(--shadow-3);z-index:120;opacity:0;pointer-events:none;transition:.22s;max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%)}
/* kanban */
.kb{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(190px,1fr);gap:10px;overflow-x:auto;padding-bottom:6px}
.kb .col{background:var(--surface-2);border-radius:var(--radius);padding:9px;min-height:120px}
.kb .col h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted-foreground);
  font-weight:700;padding:2px 4px 8px;display:flex;justify-content:space-between}
.kb-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:9px 11px;margin-bottom:8px;font-size:12px;box-shadow:var(--shadow-1)}
.kb-card b{font-size:12.5px}
/* grade do gestor */
.xl td,.xl th{white-space:nowrap}
.xl td.ro{background:var(--surface-2);color:var(--muted-foreground)}
.xl td.ed{background:#fffdf0}
.xl select{border:1px solid var(--input);border-radius:6px;padding:3px 6px;font-size:12px;background:#fff}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--muted-foreground);align-items:center;flex-wrap:wrap}
.legend .sw{width:13px;height:13px;border-radius:4px;border:1px solid var(--line);display:inline-block;vertical-align:-2px;margin-right:5px}
/* cadeia de workflow */
.chain{display:flex;flex-direction:column;gap:0}
.stg{border:1px solid var(--line);border-radius:var(--radius);padding:11px 13px;background:var(--surface);position:relative}
.stg + .stg{margin-top:22px}
.stg + .stg::before{content:"";position:absolute;top:-22px;left:28px;height:22px;width:1.5px;background:var(--line)}
.stg .t{font-weight:700;font-size:13px}
.sentence{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;
  background:var(--surface-2);border:1px dashed var(--input);border-radius:var(--radius);padding:10px 12px}
.sentence .tok{background:#fff;border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-weight:600}
.sentence .tok.hl{border-color:var(--brand-100);background:var(--brand-50);color:var(--brand-700)}
/* 6ª rodada · fluxo mandatório da verba (base → vínculo → variável → verba → conta) */
.fluxo{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.fluxo .fp{background:#fff;border:1px solid var(--brand-100);border-radius:7px;padding:3px 9px;
  font-size:11.5px;font-weight:700;color:var(--brand-700)}
.fluxo .ms{font-size:13px;color:var(--brand)}
.orig{border:1px solid var(--line);border-radius:var(--r-grp);overflow:hidden;margin-bottom:14px}
.orig .oi{display:flex;align-items:baseline;gap:11px;padding:9px 13px;border-bottom:1px solid var(--line-2);flex-wrap:wrap}
.orig .oi:last-child{border-bottom:0}
.orig .oi:nth-child(odd){background:var(--paper)}
.orig .ol{font-size:10px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3);
  width:78px;flex:none}
.orig .ov{font-size:12.5px;font-weight:700}
.orig .od{font-size:11.5px;color:var(--muted-foreground);flex:1;min-width:160px}
button.lnk,.lnk{font-size:inherit;font-weight:600;color:var(--brand-700);text-decoration:underline;
  text-underline-offset:2px;text-decoration-thickness:1px}
button.lnk:hover{color:var(--brand)}
/* checklist */
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 4px;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check .ci{width:20px;height:20px;border-radius:50%;flex:none;display:flex;align-items:center;
  justify-content:center;font-size:11px;font-weight:800;background:var(--surface-2);
  border:1.5px solid var(--line);color:var(--muted-foreground)}
.check.ok .ci{background:var(--ok-bg);border-color:transparent;color:var(--ok)}
.check .cd{font-size:11.5px;color:var(--muted-foreground)}
/* árvore de público */
.tree{font-size:13px}
.tree .tn{display:flex;align-items:center;gap:8px;padding:5px 4px}
.tree .tn.lvl2{padding-left:26px}
.tree input[type=checkbox]{accent-color:var(--primary);width:15px;height:15px}
/* pins de observação (apin amarelo do remake) */
.pin{display:none;width:18px;height:18px;border-radius:50%;background:#f4b400;color:#1a1a1a;
  font-size:11px;font-weight:700;text-align:center;line-height:16px;vertical-align:2px;
  margin-left:6px;cursor:help;position:relative;flex:none;border:1.5px solid #fff;
  box-shadow:0 1px 3px rgba(0,0,0,.35)}
body.annot .pin{display:inline-block}
.pin:hover::after{content:attr(data-tx);position:absolute;left:50%;transform:translateX(-50%);
  bottom:26px;background:#111827;color:#fff;font-size:11.5px;font-weight:500;
  padding:8px 11px;border-radius:8px;width:260px;z-index:60;line-height:1.45;text-align:left}
/* drawers e modal */
.scrim{position:fixed;inset:0;background:rgba(26,26,26,.38);z-index:90;opacity:0;pointer-events:none;transition:.2s}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:400px;max-width:92vw;background:var(--surface);
  border-left:1px solid var(--line);box-shadow:var(--shadow-3);z-index:100;display:flex;
  flex-direction:column;transform:translateX(110%);transition:transform .24s ease}
.drawer.open{transform:none}
.drawer .dh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.drawer .db{flex:1;overflow:auto;padding:16px 18px}
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:110;padding:20px}
.modal.show{display:flex}
.modal .mbox{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-3);
  max-width:560px;width:100%;max-height:88vh;overflow:auto}
.modal .mh{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center}
.modal .mb{padding:18px}
.modal .mf{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end}
/* roteiro */
.beat{display:flex;gap:11px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.beat:last-child{border-bottom:0}
.beat .bn{width:22px;height:22px;border-radius:50%;background:var(--brand-50);color:var(--brand-700);
  font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
.beat p{font-size:12px;color:var(--muted-foreground);margin-top:1px}
/* gráficos */
.chart{position:relative}
.chart svg{display:block;width:100%;height:auto}
.chart .tip{position:absolute;background:var(--foreground);color:#fff;font-size:11.5px;
  padding:7px 10px;border-radius:8px;pointer-events:none;opacity:0;transition:opacity .1s;
  z-index:5;white-space:nowrap;box-shadow:var(--shadow-2)}
.chart .tip .tv{font-weight:800;font-size:12.5px}
.chart .tip .key{display:inline-block;width:10px;height:3px;border-radius:2px;vertical-align:3px;margin-right:5px}
.leg{display:flex;gap:14px;font-size:11.5px;color:var(--muted-foreground);flex-wrap:wrap;margin-bottom:8px}
.leg .k{display:inline-block;width:14px;height:3.5px;border-radius:2px;vertical-align:3px;margin-right:5px}
.leg .kr{display:inline-block;width:10px;height:10px;border-radius:3px;vertical-align:-1px;margin-right:5px}
/* log da rodagem */
.runlog{font-family:var(--mono);font-size:12px;background:var(--foreground);color:#d9f2f1;
  border-radius:var(--radius);padding:14px 16px;max-height:260px;overflow:auto;line-height:1.7}
.runlog .ok{color:#7fe0b0} .runlog .grp{color:#e7b7d6;font-weight:700}
/* portal (home) — pageband tall do remake */
.heroband{position:relative;overflow:hidden;border-radius:var(--r-grp);box-shadow:var(--sh);
  background:linear-gradient(100deg,var(--brand-d),var(--brand));color:#fff;padding:26px 30px 24px;margin-bottom:16px}
.heroband::after{content:"";position:absolute;right:-70px;top:-90px;width:290px;height:290px;border-radius:50%;
  background:rgba(255,255,255,.06)}
.heroband::before{content:"";position:absolute;right:120px;bottom:-130px;width:230px;height:230px;border-radius:50%;
  background:rgba(255,255,255,.05)}
.heroband .eyebrow{color:rgba(255,255,255,.75)}
.heroband h1{font-size:23px;position:relative;font-weight:600}
.heroband p{position:relative;color:rgba(255,255,255,.92);font-size:13px;margin-top:5px;max-width:680px}
.heroband .meta{position:relative;display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.heroband .meta .muted{color:rgba(255,255,255,.85)}
.heroband .pin{border-color:rgba(255,255,255,.7)}
.atencao{display:flex;gap:10px;align-items:center;background:var(--warn-bg);border:1px solid #efd98f;
  border-radius:12px;padding:14px 16px;font-size:13px;font-weight:600;color:var(--warn-ink);margin-bottom:16px}
.atencao b{color:var(--warn-ink)}
.atencao .aic{color:var(--warn-ink);margin-top:1px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 12px}
.sechead h2{font-size:15.5px}
.sechead .spacer{flex:1}
.sechead a,.sechead button.lnk{font-size:12px;font-weight:600;color:var(--brand-700)}
.ptiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:12px}
.ptiles.wide{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.ptile{background:#fff;border:1px solid var(--line);border-radius:var(--r-card);box-shadow:var(--sh);
  padding:0;text-align:left;display:flex;flex-direction:column;
  transition:transform .12s,box-shadow .12s,border-color .12s;cursor:pointer;overflow:hidden}
.ptile:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--brand-100)}
.ptile .pimg{height:104px;position:relative;overflow:hidden}
.ptile .pimg svg.art{position:absolute;inset:0;width:100%;height:100%}
.ptile .pbody{padding:12px 14px 13px;display:flex;flex-direction:column;gap:5px;flex:1}
.ptile .pbody b{font-size:13px}
.ptile .pbody .pd{font-size:11.5px;color:var(--muted-foreground);flex:1}
.ptile .pst{position:absolute;top:9px;right:9px}
.ptile .pst .badge{backdrop-filter:blur(3px)}
/* premissas — página de conteúdo aberto */
.freedoc{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:26px 30px;max-width:860px;font-size:14px;line-height:1.75}
.freedoc h2{font-size:17px;margin:18px 0 8px}
.freedoc p{margin:8px 0}
.freedoc ul{padding-left:20px;margin:8px 0}
.freedoc[contenteditable="true"]:focus{outline:2px solid var(--ring);outline-offset:4px}
.freedoc img{max-width:100%;border-radius:10px;margin:10px 0}
.marcos{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(196px,1fr);gap:10px;overflow-x:auto;padding-bottom:4px}
.marco{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:12px 13px;display:flex;gap:11px;align-items:flex-start}
.marco.now{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.datetile{width:46px;flex:none;border:1px solid var(--line);border-radius:9px;overflow:hidden;text-align:center;background:var(--surface)}
.datetile .dm{display:block;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--mag-700);color:#fff;padding:2px 0}
.marco.done .datetile .dm{background:var(--muted-foreground)}
.datetile .dd{display:block;font-size:16px;font-weight:800;padding:3px 0 4px;font-variant-numeric:tabular-nums}
.marco b{font-size:12.5px;line-height:1.3;display:block}
.marco .mw{font-size:11px;color:var(--muted-foreground);margin-top:2px}
.premrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.prem{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);padding:11px 14px}
.prem .pl{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted-foreground)}
.prem .pv{font-size:18px;font-weight:800;margin-top:2px}
.prem .px{font-size:11px;color:var(--muted-foreground)}
/* administração (remake) */
.avatar-sm{width:28px;height:28px;border-radius:50%;background:var(--brand-100);color:var(--brand);
  display:inline-grid;place-items:center;font-size:11px;font-weight:700;margin-right:8px;vertical-align:middle;flex:none}
.empdot{width:12px;height:12px;border-radius:4px;display:inline-block;margin-right:8px;vertical-align:-1px}
/* rodapé de revisão */
.revfoot{margin-top:34px;border-top:1px solid var(--line);padding-top:12px;font-size:11px;
  color:var(--muted-foreground);display:flex;gap:16px;flex-wrap:wrap}
/* ---------- 5ª rodada (2026-07-31) ---------- */
/* cards centralizados (pedido do usuário) */
.kpi{text-align:center}
.kpi .lbl,.kpi .val,.kpi .delta{text-align:center}
.ptiles{justify-content:center}
.content{max-width:1500px}
/* dica de ferramenta com cards (total mensal do aumento de quadro) */
.tt{position:relative;display:inline-flex;align-items:center;gap:5px;cursor:help;border-bottom:1px dashed var(--ink-3)}
.tt .ttp{position:absolute;bottom:calc(100% + 9px);left:50%;transform:translateX(-50%) translateY(4px);
  background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh-lg);
  padding:11px;z-index:70;display:none;gap:8px;width:340px}
.tt:hover .ttp,.tt:focus-within .ttp{display:flex;transform:translateX(-50%)}
.tt .ttp .tc{flex:1;background:var(--paper);border:1px solid var(--line-2);border-radius:10px;padding:9px 10px;text-align:center}
.tt .ttp .tc .l{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--ink-3)}
.tt .ttp .tc .v{font-size:15px;font-weight:800;margin-top:2px}
/* blocos editáveis do cenário (toggle + linha a linha + ajuste %) */
.blk{border:1px solid var(--line);border-radius:var(--r-grp);background:var(--surface);margin-bottom:10px;overflow:hidden}
.blk>.bh{display:flex;align-items:center;gap:11px;padding:12px 15px;background:var(--paper);cursor:pointer}
.blk>.bh .bt{font-weight:700;font-size:13px}
.blk>.bh .bv{font-weight:700;font-variant-numeric:tabular-nums}
.blk>.bh .car{color:var(--ink-3);transition:transform .15s}
.blk.open>.bh .car{transform:rotate(90deg)}
.blk>.bb{display:none;padding:12px 15px;border-top:1px solid var(--line)}
.blk.open>.bb{display:block}
.blk.off{opacity:.55}
.adj{display:flex;align-items:center;gap:8px;background:var(--brand-50);border:1px solid var(--brand-100);
  border-radius:10px;padding:8px 11px;margin-bottom:11px;flex-wrap:wrap;font-size:12.5px}
.adj .stp{display:flex;gap:4px}
.adj .stp button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 9px;font-weight:700;font-size:12px}
.adj .stp button:hover{border-color:var(--brand);color:var(--brand)}
/* organograma */
.org{font-size:13px}
.orgn{border:1px solid var(--line);border-radius:12px;background:var(--surface);margin-bottom:7px}
.orgn .oh{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer}
.orgn .oh .car{color:var(--ink-3);transition:transform .15s;flex:none}
.orgn.open>.oh .car{transform:rotate(90deg)}
.orgn .oh .onm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orgn .oh .om{display:flex;gap:16px;flex:none;font-variant-numeric:tabular-nums;font-size:12.5px}
.orgn .oh .om b{font-weight:700}
.orgn>.ob{display:none;padding:0 11px 11px 30px}
.orgn.open>.ob{display:block}
.orgn.lvl1{border-left:3px solid var(--s1)}
.orgn.lvl2{border-left:3px solid var(--s2)}
.orgn.lvl3{border-left:3px solid var(--s3)}
/* copiloto RH Numbers */
.cop{width:430px}
.cop .db{background:var(--paper)}
.copmsg{border-radius:12px;padding:10px 13px;margin-bottom:9px;font-size:12.5px;line-height:1.55}
.copmsg.u{background:var(--brand);color:#fff;margin-left:34px}
.copmsg.a{background:#fff;border:1px solid var(--line)}
.copmsg.a b{color:var(--brand)}
.copmsg .act{margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}
.cop .cf{border-top:1px solid var(--line);padding:11px 14px;background:var(--surface)}
.cop .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
.cop .chips button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 11px;font-size:11.5px;font-weight:600;color:var(--ink-2);text-align:left}
.cop .chips button:hover{border-color:var(--brand);color:var(--brand)}
.copbar{display:flex;gap:8px}
.copbar input{flex:1;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;font-family:inherit}
.copbar input:focus{outline:0;border-color:var(--brand)}
.fab{position:fixed;right:22px;bottom:22px;z-index:80;border-radius:26px;padding:12px 18px;
  background:var(--grad-ia);color:#fff;font-weight:700;font-size:13px;box-shadow:var(--sh-lg);
  display:inline-flex;align-items:center;gap:8px}
.fab:hover{filter:brightness(1.08)}
/* sino de notificações */
.bell{position:relative;width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--ink-2)}
.bell:hover{background:var(--bg);color:var(--brand)}
.bell .dot{position:absolute;top:5px;right:5px;min-width:16px;height:16px;border-radius:9px;background:var(--bad);
  color:#fff;font-size:9.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid #fff}
.ntf{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line-2);align-items:flex-start}
.ntf:last-child{border-bottom:0}
.ntf .ni{width:30px;height:30px;border-radius:9px;flex:none;display:grid;place-items:center;background:var(--brand-50);color:var(--brand)}
.ntf.nova .ni{background:var(--warn-bg);color:var(--warn-ink)}
.ntf b{font-size:12.5px;display:block}
.ntf .nd{font-size:11.5px;color:var(--ink-2);margin-top:2px}
.ntf .nt{font-size:10.5px;color:var(--ink-3);margin-top:3px}
/* faixa de impacto (base em uso) */
.impacto{display:flex;gap:11px;background:var(--warn-bg);border:1px solid #efd98f;border-radius:12px;
  padding:13px 16px;font-size:12.5px;color:var(--warn-ink);margin-bottom:14px;align-items:flex-start}
.impacto b{color:var(--warn-ink)}
/* selo RH Numbers — CTA de integração (a plataforma é independente) */
.rhn-cta{display:inline-flex;align-items:center;gap:8px;border:1px dashed var(--brand);color:var(--brand);
  background:var(--brand-50);border-radius:11px;padding:9px 14px;font-weight:600;font-size:12.5px}
.rhn-cta:hover{background:var(--brand-100)}
.rhn-cta .sel{font-size:9.5px;font-weight:800;letter-spacing:.06em;background:var(--brand);color:#fff;border-radius:5px;padding:2px 6px}
/* seleção múltipla na grade */
.selbar{display:flex;align-items:center;gap:10px;background:var(--brand-100);border:1px solid var(--brand);
  border-radius:12px;padding:10px 14px;margin-bottom:11px;flex-wrap:wrap;font-size:12.5px;font-weight:600;color:var(--brand)}
.xl td.sub{background:#fff;border-bottom:0;padding-top:0}
.subed{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;background:#fffdf0;
  border:1px solid #f0e6b8;border-radius:10px;padding:9px 12px;margin:2px 0 8px}
.subed .f{display:flex;flex-direction:column;gap:3px}
.subed .f label{font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--ink-3)}
.subed .res{margin-left:14px;font-size:12.5px;font-weight:700;color:var(--ok);white-space:nowrap;padding-bottom:5px}
@media(max-width:1080px){
  .app{grid-template-columns:1fr}
  .menu-btn{display:inline-flex}
  .sidebar{position:fixed;top:0;left:0;height:100vh;width:var(--sidebar-w);
    transform:translateX(-104%);transition:transform .22s ease;box-shadow:var(--shadow-3)}
  .app.nav-open .sidebar{transform:none}
  .g4,.g3{grid-template-columns:repeat(2,1fr)}
  .g23,.g32,.g2{grid-template-columns:1fr}
  .row.c3,.row.c4{grid-template-columns:1fr 1fr}
}
@media(max-width:600px){.g4,.g3,.row.c3,.row.c4{grid-template-columns:1fr}.content{padding:16px 12px 60px}
  .tabs{margin:0 -12px 16px;padding:7px 12px 0}}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <b>RH Budget</b><small>Aurora Mineração · Orçamento 2027</small>
      <div class="logo" aria-hidden="true"><i></i></div>
    </div>
    <nav class="nav" id="nav" aria-label="Menu"></nav>
    <div class="foot"><div class="nav-user" id="whoami"></div><div id="masterSw"></div></div>
  </aside>
  <div class="main">
    <header class="topbar">
      <button class="menu-btn" id="menuBtn" aria-label="Abrir menu"><span class="ms">menu</span></button>
      <div class="crumb" id="crumb"></div>
      <div class="spacer"></div>
      <div class="surface-sw" id="papelSw" role="group" aria-label="Ver como"></div>
      <span class="fict">Dados ilustrativos para validação de layout</span>
      <button class="bell" id="btnSino" aria-label="Notificações"><span class="ms">notifications</span><span id="sinoDot"></span></button>
      <button class="btn btn-sm" id="btnAnnot" aria-pressed="false" title="Pins numerados ligados às specs de fase">
        <span class="ms sm">info</span> Observações</button>
      <button class="btn btn-sm" id="btnRoteiro"><span class="ms sm">menu_book</span> Roteiro do demo</button>
      <button class="btn btn-sm" id="btnReset" title="Restaurar dados de exemplo"><span class="ms sm">restart_alt</span></button>
    </header>
    <main class="content" id="view" tabindex="-1"></main>
  </div>
</div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="roteiro" aria-label="Roteiro do demo">
  <div class="dh"><b>Roteiro do demo</b><span class="badge b-brand">12 momentos</span>
    <span style="flex:1"></span>
    <button class="btn btn-sm" id="roteiroClose" aria-label="Fechar"><span class="ms sm">close</span></button>
  </div>
  <div class="db" id="roteiroBody"></div>
</aside>
<aside class="drawer" id="obsPanel" aria-label="Observações da tela">
  <div class="dh"><span style="width:12px;height:12px;border-radius:50%;background:#f4b400"></span>
    <b>Observações desta tela</b>
    <span style="flex:1"></span>
    <button class="btn btn-sm" id="obsClose" aria-label="Fechar"><span class="ms sm">close</span></button>
  </div>
  <div class="db" id="obsBody"></div>
</aside>
<aside class="drawer" id="sinoPanel" aria-label="Notificações">
  <div class="dh"><span class="ms">notifications</span><b>Notificações</b><span style="flex:1"></span>
    <button class="btn btn-sm" onclick="A.ntfLerTodas()">Marcar todas como lidas</button>
    <button class="btn btn-sm" id="sinoClose" aria-label="Fechar"><span class="ms sm">close</span></button>
  </div>
  <div class="db" id="sinoBody"></div>
</aside>
<aside class="drawer cop" id="copiloto" aria-label="Copiloto RH Numbers">
  <div class="dh"><span style="width:26px;height:26px;border-radius:50%;background:var(--grad-ia);flex:none"></span>
    <b>Copiloto RH Numbers</b>
    <span style="flex:1"></span>
    <button class="btn btn-sm" onclick="A.copLimpar()" aria-label="Limpar conversa"><span class="ms sm">restart_alt</span></button>
    <button class="btn btn-sm" id="copClose" aria-label="Fechar"><span class="ms sm">close</span></button>
  </div>
  <div class="db" id="copBody"></div>
  <div class="cf">
    <div class="chips" id="copChips"></div>

<script>
/* ============================================================
   MOTOR DE CUSTO — quadro mensal por cenário + verbas
   Fórmulas na spec §6. Alíquotas = default do protótipo (§8).
   ============================================================ */
"use strict";
const Engine=(()=>{
  const TEMP_MOVS=[ // temporários sazonais (workflow temp)
    {cc:"OP-MINA-N",func:"OPM-001",qtd:10,de:1,ate:3},
    {cc:"LOG-FROTA",func:"MOT-003",qtd:4,de:1,ate:2},
  ];
  const ccById=id=>CCS.find(c=>c.id===id);

  /* ================= VARIÁVEIS DE CÁLCULO (6ª rodada) =================
     Uma variável é "um valor que muda por dimensão". Quando está ativa e amarrada a uma
     verba, o valor da dimensão do colaborador SOBREPÕE o percentual/valor global do cadastro.
     É assim que CCT/ACT por unidade, por CC ou por faixa etária entram sem tela nova. */
  function params(){ return Store.get().parametros||[]; }
  function varsPorVerba(){
    const out={};
    params().filter(p=>p.ativa!==false).forEach(p=>
      (p.verbas||[]).forEach(id=>{ (out[id]=out[id]||[]).push(p); }));
    return out;
  }
  /* resolve o valor da variável para o contexto de uma linha do quadro.
     Dimensão sem membro no contexto (faixa etária, pessoa) → média dos valores cadastrados. */
  function valorVar(lista,ctx){
    if(!lista||!lista.length) return null;
    for(const p of lista){
      if(p.tipo!=="percentual"&&p.tipo!=="valor") continue;
      const chave={global:"*",cc:ctx.cc,funcao:ctx.func,sindicato:ctx.sind,unidade:ctx.unidade}[p.dim];
      if(chave!=null){ const v=p.vals[chave]; if(v!=null) return v; continue; }
      const vs=Object.values(p.vals||{}).filter(x=>typeof x==="number");
      if(vs.length) return vs.reduce((a,b)=>a+b,0)/vs.length;
    }
    return null;
  }
  /* variável global amarrada a uma verba (usada pelo cálculo de HE, fora do laço por linha) */
  function varGlobal(verbaId,chave){
    const p=(varsPorVerba()[verbaId]||[]).find(x=>x.dim==="global"&&x.chave===chave);
    return p?p.vals["*"]:null;
  }

  /* ---- Blocos de movimento do cenário (5ª rodada) ----
     Cada bloco é um toggle que o RH/CFO abre, edita LINHA A LINHA e ajusta em % dentro do próprio bloco.
     `derivados` = o que veio das grades dos gestores. Quando o usuário edita, o bloco é
     MATERIALIZADO em cen.linhas[bloco] e passa a valer no lugar do derivado. */
  const BLOCOS_MOV=["vagas","deslig","afast","temp"];
  function derivados(cen,bloco){
    const st=Store.get(), out=[];
    if(bloco==="vagas"){
      MOVS_SEED.filter(m=>m.tipo==="admissao").forEach(m=>out.push({...m}));
      (st.coleta.wf.novas?.rows||[]).forEach(r=>out.push({cc:"OP-BENEF",func:r.func,qtd:r.qtd,mes:r.mes,
        tipo:"admissao",origem:"Novas vagas",motivo:r.just||"Proposta do gestor"}));
      (cen.extras||[]).forEach(m=>out.push({cc:m.cc,func:m.func,qtd:m.qtd,mes:m.mes,tipo:"admissao",origem:"cenário"}));
    }
    if(bloco==="deslig"){
      MOVS_SEED.filter(m=>m.tipo==="desligamento").forEach(m=>out.push({...m}));
      const n=Object.values(st.coleta.decisoes).filter(d=>d.d==="desligar").length;
      if(n) out.push({cc:"OP-BENEF",func:"OPB-005",qtd:-n,mes:7,tipo:"desligamento",origem:"Quadro / Efetivo",motivo:"Decisão do gestor"});
    }
    if(bloco==="afast"){
      const n=Object.values(st.coleta.decisoes).filter(d=>d.d==="afastado").length;
      if(n) out.push({cc:"OP-BENEF",func:"OPB-005",qtd:-n,mes:1,tipo:"afastamento",origem:"Quadro / Efetivo",motivo:"Afastados fora do custo"});
    }
    if(bloco==="temp"){
      TEMP_MOVS.forEach(m=>out.push({...m,tipo:"temporario",origem:"Temporários",motivo:"Janela sazonal"}));
      (st.coleta.wf.temp?.rows||[]).forEach(r=>out.push({cc:"OP-BENEF",func:r.func,qtd:r.qtd,de:r.de,ate:r.ate,
        tipo:"temporario",origem:"Temporários",motivo:r.motivo||"Proposta do gestor"}));
    }
    return out;
  }
  /* linhas efetivas do bloco: override do cenário (se materializado) ou derivadas */
  function linhasBloco(cen,bloco){
    const ov=cen&&cen.linhas&&cen.linhas[bloco];
    return ov?ov.map(m=>({...m})):derivados(cen||{toggles:{}},bloco);
  }
  const ajusteDe=(cen,bloco)=>((cen&&cen.ajustes)||{})[bloco]||0;
  /* linhas do bloco COM o ajuste % aplicado à quantidade */
  function linhasAjustadas(cen,bloco){
    const f=1+ajusteDe(cen,bloco)/100;
    return linhasBloco(cen,bloco).map(m=>({...m,qtd:Math.round(m.qtd*f)})).filter(m=>m.qtd);
  }
  /* movimentos ativos do cenário (toggles D21 + edição linha a linha + ajuste %) */
  function movimentos(cen){
    if(!cen) return [];
    return ["vagas","deslig","afast"].filter(b=>cen.toggles[b]).flatMap(b=>linhasAjustadas(cen,b));
  }
  function temporarios(cen){ return cen&&cen.toggles.temp?linhasAjustadas(cen,"temp"):[]; }

  /* linhas {cc,func,qtd[12]} do cenário */
  function quadroMensal(cen){
    const rows=QUADRO.map(([cc,func,q])=>({cc,func,qtd:Array(12).fill(q)}));
    const add=(cc,func,q,de,ate)=>{
      let r=rows.find(x=>x.cc===cc&&x.func===func);
      if(!r){r={cc,func,qtd:Array(12).fill(0)};rows.push(r);}
      for(let m=de-1;m<(ate||12);m++) r.qtd[m]+=q;
    };
    if(cen){ movimentos(cen).forEach(m=>add(m.cc,m.func,m.qtd,m.mes));
             temporarios(cen).forEach(m=>add(m.cc,m.func,m.qtd,m.de,m.ate)); }
    return rows;
  }

  /* custo completo do CENÁRIO ÚNICO (5ª rodada): headcount e custo no mesmo objeto.
     cen=null → baseline 2026. `delta` opcional só para simulações de prévia; por padrão usa cen.delta. */
  function custo(cen,delta){
    const st=Store.get(), V=st.verbas, on=V.ativas, d=delta||(cen&&cen.delta)||{};
    const aj=(cen&&cen.ajustes)||{};
    const benF=(d.benFator??1)*(1+(aj.benef||0)/100), extra=d.reajusteExtra??0;
    const merito=cen&&cen.toggles.merito? (V.pack.merito/100)*(1+(aj.merito||0)/100):0;
    const promo=cen&&cen.toggles.promo? .004*(1+(aj.promo||0)/100):0; // uplift médio de promoções na massa
    const rows=quadroMensal(cen);
    const porVerba={}; VERBAS.forEach(v=>porVerba[v.id]=Array(12).fill(0));
    const porCC={}; CCS.forEach(c=>porCC[c.id]=0);
    const porCR={}; CRS.forEach(r=>porCR[r.id]=0);
    const hc=Array(12).fill(0);
    const hcOperBase={}; // p/ escalar HE
    CCS.forEach(c=>hcOperBase[c.id]=QUADRO.filter(q=>q[0]===c.id).reduce((s,q)=>s+q[2],0));
    /* condições de elegibilidade (modelo real: flags por função/CC) */
    const condOk=(v,f,c)=>!v.cond||({peric:f.peric,turno:f.turno,oper:c.oper,lider:f.lider})[v.cond];
    const PCT_SAL=VERBAS.filter(v=>v.pct!=null&&v.base==="salário");
    const PCT_TRIB=VERBAS.filter(v=>v.base==="rem. tributável");
    const PERCAP=VERBAS.filter(v=>v.valor!=null);
    /* 6ª rodada · PROVISÕES CONFIGURÁVEIS: o RH escolhe o que o ciclo provisiona.
       Férias = base (8,33%) + 1/3 (2,78%) — cada parte liga/desliga sozinha. */
    const prov=st.ciclo.provisao||{dec13:true,ferias:true,terco:true};
    const FER_B=8.33, FER_T=2.78;
    const fatFer=((prov.ferias?FER_B:0)+(prov.terco?FER_T:0))/(FER_B+FER_T);
    const fat13=prov.dec13?1:0;
    /* 6ª rodada · VARIÁVEIS DE CÁLCULO: quando uma variável ativa está amarrada à verba,
       o valor por dimensão SOBREPÕE o percentual/valor global do cadastro. */
    const VARV=varsPorVerba();
    const resolveVar=(id,ctx)=>valorVar(VARV[id],ctx);
    for(const r of rows){
      const f=FUNCOES[r.func], c=ccById(r.cc), s=V.sind[c.sind];
      const ctx={cc:c.id,func:r.func,sind:c.sind,unidade:SINDICATOS[c.sind].unidade};
      const reajPct=(cen? (st.ciclo.premissas.reajustes[c.sind]+extra):0);
      for(let m=0;m<12;m++){
        const n=r.qtd[m]; if(!n) continue; hc[m]+=n;
        const reaj=(m+1)>=s.dataBase?1+reajPct/100:1;
        const fMer=(merito&&m>=6?1+merito:1)*(promo&&m>=8?1+promo:1);
        const sal=f.sal*reaj*fMer;
        let rem=0;
        const put=(id,val)=>{ if(on[id]){porVerba[id][m]+=val;porCC[c.id]+=val;porCR[crDoCC(c.id)]+=val;} return on[id]?val:0; };
        rem+=put("sal",sal*n);
        for(const v of PCT_SAL) if(condOk(v,f,c)){
          const pv=resolveVar(v.id,ctx);
          rem+=put(v.id,sal*((pv!=null?pv:(V.pct[v.id]??v.pct))/100)*n);}
        const dec13=put("dec13",rem*(V.pct.dec13/100)*fat13);
        const fer=put("fer",rem*(V.pct.fer/100)*fatFer);
        const base=rem+dec13+fer;
        put("inss",base*(s.inss/100));
        put("fgts",base*(s.fgts/100));
        for(const v of PCT_TRIB) if(condOk(v,f,c)) put(v.id,base*((V.pct[v.id]??v.pct)/100));
        for(const v of PERCAP) if(condOk(v,f,c)){
          const vv=resolveVar(v.id,ctx);
          put(v.id,(vv!=null?vv:(V.valores[v.id]??v.valor))*benF*n);}
      }
    }
    /* ---- 6ª rodada · CUSTOS DE MOVIMENTAÇÃO (turnover): disparam por EVENTO, não por headcount.
       Cada admissão do cenário puxa recrutamento, exame, uniforme e integração no mês em que entra;
       cada desligamento puxa a rescisão. É por isso que eles não aparecem na conta per capita. ---- */
    const EVENTOS=VERBAS.filter(v=>v.evento);
    if(cen&&EVENTOS.length){
      const evLin=[];
      movimentos(cen).forEach(m=>{
        if(m.qtd>0) evLin.push({cc:m.cc,mes:m.mes||1,q:m.qtd,ev:"admissao"});
        else if(m.qtd<0&&m.tipo==="desligamento") evLin.push({cc:m.cc,mes:m.mes||1,q:-m.qtd,ev:"desligamento"});});
      temporarios(cen).forEach(m=>evLin.push({cc:m.cc,mes:m.de||1,q:m.qtd,ev:"admissao"}));
      EVENTOS.forEach(v=>{ if(!on[v.id])return;
        const val=V.valores[v.id]??v.porEvento;
        evLin.filter(l=>l.ev===v.evento).forEach(l=>{
          const m=Math.max(0,Math.min(11,(l.mes||1)-1)), tot=val*l.q;
          porVerba[v.id][m]+=tot;
          porCC[l.cc]=(porCC[l.cc]||0)+tot;
          porCR[crDoCC(l.cc)]=(porCR[crDoCC(l.cc)]||0)+tot;});});
    }
    /* HE por CC: média realizada × fator do sindicato × (1 − corte de HE) × reajuste */
    if(on.he) for(const c of CCS){
      const s=V.sind[c.sind], reajPct=(cen?(st.ciclo.premissas.reajustes[c.sind]+extra):0);
      const rowsCC=rows.filter(r=>r.cc===c.id);
      /* corte de HE: a variável global manda, se estiver ativa no cadastro */
      const corteVar=varGlobal("he","pack.corte_he");
      const corte=1-((corteVar!=null?corteVar:V.pack.corteHE)||0)/100;
      for(let m=0;m<12;m++){
        const hcm=rowsCC.reduce((t,r)=>t+r.qtd[m],0);
        const reaj=(m+1)>=s.dataBase?1+reajPct/100:1;
        const v=c.heMedia*s.fatorHE/1.5*corte*reaj*(hcm/Math.max(1,hcOperBase[c.id]));
        porVerba.he[m]+=v; porCC[c.id]+=v; porCR[crDoCC(c.id)]+=v;
      }
    }
    /* laterais ATRELADAS A PESSOA (listas nominais do ciclo — somam no Total, como a medida real) */
    for(const v of VERBAS.filter(x=>x.lateral!=null&&ancoraDe(x)==="pessoa")) if(on[v.id])
      for(let m=0;m<12;m++) porVerba[v.id][m]+=(V.valores[v.id]??v.lateral)*(v.grupo==="Benefícios"?benF:1);
    /* verbas GENÉRICAS (5ª rodada): não têm pessoa — vêm da base conta × centro de resultado.
       Somam no total do mesmo jeito, mas o rateio é por CR/conta, não por headcount. */
    const porContaGen={};
    for(const l of CUSTO_CR_CONTA){
      const v=VERBAS.find(x=>x.id===l.verba);
      if(!v||!on[v.id]||ancoraDe(v)!=="generica")continue;
      for(let m=0;m<12;m++) porVerba[v.id][m]+=l.mes;
      porCR[l.cr]=(porCR[l.cr]||0)+l.mes*12;
      porContaGen[l.gl]=(porContaGen[l.gl]||0)+l.mes*12;
    }
    /* verbas do cadastro (extras): % sobre a remuneração ou per capita */
    const extras=(V.extras||[]).filter(e=>on[e.id]!==false);
    if(extras.length){
      const remM=Array(12).fill(0);
      VERBAS.filter(v=>v.grupo==="Remuneração").forEach(v=>{for(let m=0;m<12;m++)remM[m]+=porVerba[v.id][m];});
      extras.forEach(e=>{porVerba[e.id]=Array(12).fill(0);
        for(let m=0;m<12;m++) porVerba[e.id][m]=e.modo==="percapita"?(e.valor||0)*hc[m]:remM[m]*(e.pct||0)/100;});
    }
    const TODAS=[...VERBAS,...extras];
    const soma=a=>a.reduce((x,y)=>x+y,0);
    /* ---- % POR VERBA do cenário (5ª rodada): reajuste fino dentro do toggle "% por verba" ---- */
    const vAj=(cen&&cen.verbaAj)||{};
    const antes=TODAS.reduce((s,v)=>s+soma(porVerba[v.id]),0);
    TODAS.forEach(v=>{const p=vAj[v.id];
      if(p) for(let m=0;m<12;m++) porVerba[v.id][m]*=(1+p/100);});
    const depois=TODAS.reduce((s,v)=>s+soma(porVerba[v.id]),0);
    /* mantém a matriz por CC/CR somando o mesmo total após os ajustes por verba */
    if(antes>0&&depois!==antes){const k=depois/antes;
      CCS.forEach(c=>porCC[c.id]*=k); CRS.forEach(r=>porCR[r.id]*=k);}
    /* ---- 6ª rodada · RECONCILIAÇÃO DA MATRIZ POR CC ----
       As laterais nominais e as verbas criadas no cadastro somam no total mas não passam pelo
       laço por linha, então nunca entravam em porCC/porCR: a tabela por centro de custo fechava
       ~1,4% abaixo do total. Rateia o resíduo pela participação de custo de cada CC. */
    {
      const somaPessoa=TODAS.filter(v=>ancoraDe(v)!=="generica").reduce((s,v)=>s+soma(porVerba[v.id]),0);
      const alocado=CCS.reduce((s,c)=>s+porCC[c.id],0);
      const resto=somaPessoa-alocado;
      if(alocado>0&&Math.abs(resto)>1){
        CCS.forEach(c=>{const parte=resto*(porCC[c.id]/alocado);
          porCC[c.id]+=parte; porCR[crDoCC(c.id)]+=parte;});
      }
    }
    const porGrupo={}; GRUPOS.forEach(g=>porGrupo[g]=Array(12).fill(0));
    TODAS.forEach(v=>{for(let m=0;m<12;m++)porGrupo[v.grupo][m]+=porVerba[v.id][m];});
    const mensal=Array(12).fill(0);
    GRUPOS.forEach(g=>{for(let m=0;m<12;m++)mensal[m]+=porGrupo[g][m];});
    const total=mensal.reduce((a,b)=>a+b,0);
    /* split pessoa × genérica — a leitura que o usuário pediu nas Bases */
    const totPessoa=TODAS.filter(v=>ancoraDe(v)!=="generica").reduce((s,v)=>s+soma(porVerba[v.id]),0);
    return {porVerba,porGrupo,porCC,porCR,porContaGen,mensal,total,hc,
      totPessoa,totGenerica:total-totPessoa,
      grupoTotal:Object.fromEntries(GRUPOS.map(g=>[g,soma(porGrupo[g])])),
      verbaTotal:Object.fromEntries(TODAS.map(v=>[v.id,soma(porVerba[v.id])]))};
  }

  /* waterfall 2026 → 2027 (pareado com tabela) */
  function waterfall(cen,delta){
    const t26=custo(null,null);
    /* preserva delta/ajustes/verbaAj do cenário ao desligar só os movimentos */
    const semMov=Object.assign({},cen,{toggles:Object.assign({},cen.toggles,{vagas:false,deslig:false,temp:false,afast:false})});
    const a=custo(semMov,delta), b=custo(cen,delta);
    const R=x=>x.grupoTotal["Remuneração"], EP=x=>x.grupoTotal["Provisões"]+x.grupoTotal["Encargos"], BEN=x=>x.grupoTotal["Benefícios"];
    /* 6ª rodada: o grupo Movimentação entra na ponte com degrau próprio. Sem ele, a soma dos
       degraus deixava de fechar com o total — e a regra da casa é que o waterfall nunca diverge. */
    const MOV=x=>x.grupoTotal["Movimentação"]||0;
    return {t26:t26.total,t27:b.total,res:b,steps:[
      {nome:"Custo 2026",tipo:"total",val:t26.total},
      {nome:"Dissídio e mérito",tipo:"delta",val:R(a)-R(t26)},
      {nome:"Movimentos do quadro",tipo:"delta",val:R(b)-R(a)},
      {nome:"Provisões e encargos",tipo:"delta",val:EP(b)-EP(t26)},
      {nome:"Benefícios",tipo:"delta",val:BEN(b)-BEN(t26)},
      {nome:"Movimentação e turnover",tipo:"delta",val:MOV(b)-MOV(t26)},
      {nome:"Orçamento 2027",tipo:"total",val:b.total},
    ]};
  }

  function cenPorId(id){ return Store.get().cenarios.find(c=>c.id===id); }
  function oficial(){ const st=Store.get(); return st.cenarios.find(c=>c.oficial)||st.cenarios[0]; }
  /* custo estimado de um movimento proposto */
  function custoMov(func,qtd,mes){
    const f=FUNCOES[func]; const meses=12-((mes||1)-1);
    return f.sal*1.85*qtd*meses; // fator médio encargos+benefícios do protótipo
  }
  /* impacto anual de ligar/desligar um bloco do cenário — alimenta o cabeçalho do toggle */
  function impactoBloco(cen,k){
    const on=cen.toggles[k];
    const alt=Object.assign({},cen,{toggles:Object.assign({},cen.toggles,{[k]:!on})});
    return custo(cen).total-custo(alt).total;
  }

  /* ================= ORGANOGRAMA (5ª rodada) =================
     Árvore por gestor imediato, montada sobre POSIÇÃO / POSIÇÃO PAI.
     Cada nó soma headcount e custo de verdade a partir do cenário. */
  function organograma(cen){
    const res=custo(cen), qm=quadroMensal(cen);
    const hcCC={}, custoCC={};
    CCS.forEach(c=>{hcCC[c.id]=qm.filter(r=>r.cc===c.id).reduce((s,r)=>s+r.qtd[11],0);
                    custoCC[c.id]=res.porCC[c.id]||0;});
    const nosFunc=cc=>qm.filter(r=>r.cc===cc&&r.qtd[11]>0)
      .sort((a,b)=>b.qtd[11]-a.qtd[11])
      .map(r=>({id:posDoCC(cc)+"-"+r.func,pai:posDoCC(cc),nome:FUNCOES[r.func].nome,
        tipo:"funcao",hc:r.qtd[11],
        custo:custoCC[cc]*(r.qtd[11]/Math.max(1,hcCC[cc]))}));
    const dirs=Object.entries(DIRS).map(([k,d])=>{
      const ccs=CCS.filter(c=>c.dir===k).map(c=>({
        id:posDoCC(c.id),pai:POS_DIR[k],nome:c.nome+" · "+c.id,tipo:"cc",gestor:c.gestor,
        hc:hcCC[c.id],custo:custoCC[c.id],filhos:nosFunc(c.id)}));
      return {id:POS_DIR[k],pai:null,nome:d.nome,tipo:"diretoria",gestor:d.dir,
        hc:ccs.reduce((s,c)=>s+c.hc,0),custo:ccs.reduce((s,c)=>s+c.custo,0),filhos:ccs};
    });
    return {nome:"Aurora Mineração",hc:dirs.reduce((s,d)=>s+d.hc,0),
      custo:dirs.reduce((s,d)=>s+d.custo,0),filhos:dirs};
  }

  /* ================= CONFORMIDADE (5ª rodada) =================
     Roda regras sobre as verbas do catálogo e o cenário, e lista o que está incoerente. */
  function conformidade(cen){
    const st=Store.get(), V=st.verbas, out=[];
    const TODAS=[...VERBAS,...(V.extras||[])];
    const add=(sev,regra,item,detalhe,rota)=>out.push({sev,regra,item,detalhe,rota});
    TODAS.filter(v=>V.ativas[v.id]!==false).forEach(v=>{
      const anc=ancoraDe(v);
      /* 1. verba genérica precisa de linha na base conta × centro de resultado */
      if(anc==="generica"&&!CUSTO_CR_CONTA.some(l=>l.verba===v.id))
        add("erro","Verba genérica sem lançamento",v.nome,
          "Marcada como genérica, mas não tem linha na base Custo por conta × centro de resultado — entra no total como zero.","bases");
      /* 2. verba com incidência fora da faixa plausível */
      const p=V.pct[v.id]??v.pct;
      if(p!=null&&(p<0||p>60))
        add("erro","Incidência fora da faixa",v.nome,"Percentual de "+fmtPct(p)+" sobre "+(v.base||"salário")+" — revise o cadastro.","verbas");
      else if(p!=null&&p>35)
        add("aviso","Incidência alta",v.nome,"Percentual de "+fmtPct(p)+" sobre "+(v.base||"salário")+" — confirme se é intencional.","verbas");
      /* 3. verba sem conta contábil */
      const gl=contaDe(v);
      if(!gl||!CONTAS[gl]&&!v.extra)
        add("aviso","Conta contábil não mapeada",v.nome,"A conta "+(gl||"—")+" não está no de-para contábil.","verbas");
      /* 4. verba per capita sem valor */
      if(anc==="pessoa"&&v.valor!=null&&!(V.valores[v.id]??v.valor))
        add("erro","Verba per capita sem valor",v.nome,"Ativa e ancorada em pessoa, mas com valor zerado.","verbas");
      /* 5. (6ª rodada) verba de movimentação sem custo por evento */
      if(v.evento&&!(V.valores[v.id]??v.porEvento))
        add("erro","Custo de movimentação zerado",v.nome,
          "Dispara por "+(v.evento==="admissao"?"admissão":"desligamento")+", mas está sem valor por evento — o turnover entra de graça no orçamento.","verbas");
      /* 6. (6ª rodada) verba sem base de origem declarada — quebra o fluxo mandatório */
      const fo=fonteDe(v);
      if(!v.extra&&!st.bases[fo.base])
        add("aviso","Base de origem inexistente",v.nome,
          "O fluxo desta verba aponta para a base "+fo.base+", que não está na biblioteca do ciclo.","bases");
    });
    /* 7. (6ª rodada) variável ativa com membro da dimensão sem valor */
    (st.parametros||[]).filter(p=>p.ativa!==false).forEach(p=>{
      const faltam=dimDe(p.dim).membros().filter(([k])=>p.vals[k]==null);
      if(faltam.length) add("aviso","Variável incompleta",p.nome,
        faltam.length+" membro(s) de "+dimDe(p.dim).nome.toLowerCase()+" sem valor ("
        +faltam.slice(0,3).map(m=>m[0]).join(", ")+(faltam.length>3?"…":"")+") — o motor usa o cadastro global.","parametros");
    });
    /* 5. verba de pessoa em centro de resultado sem quadro */
    const qm=quadroMensal(cen);
    CRS.forEach(r=>{
      const hc=qm.filter(x=>r.ccs.includes(x.cc)).reduce((s,x)=>s+x.qtd[11],0);
      if(!hc&&CUSTO_CR_CONTA.some(l=>l.cr===r.id))
        add("aviso","Centro de resultado sem quadro",r.nome,
          "Tem custo lançado por conta, mas nenhuma posição ativa em dez/27.","organograma");
    });
    /* 6. verbas desligadas que o pack BR considera obrigatórias */
    ["inss","fgts","dec13","fer"].forEach(id=>{ if(V.ativas[id]===false){
      const v=VERBAS.find(x=>x.id===id);
      add("erro","Verba legal desligada",v.nome,"O pack BR trata esta verba como obrigatória — desligar distorce o orçamento.","verbas");}});
    const ordem={erro:0,aviso:1};
    return out.sort((a,b)=>ordem[a.sev]-ordem[b.sev]);
  }

  /* ================= CHECK FINAL DAS BASES (5ª rodada) =================
     "As bases casam?" — validações cruzadas antes de abrir o ciclo. */
  function checkBases(){
    const st=Store.get(), out=[];
    const add=(ok,titulo,detalhe,n)=>out.push({ok,titulo,detalhe,n});
    const funcsQuadro=[...new Set(QUADRO.map(q=>q[1]))];
    add(funcsQuadro.every(f=>FUNCOES[f]),"Toda função do quadro existe na base Função",
      funcsQuadro.length+" códigos de função conferidos contra a base Função.",funcsQuadro.length);
    add(CCS.every(c=>SINDICATOS[c.sind]),"Todo centro de custo tem sindicato",
      "Cada CC aponta para um sindicato válido — o dissídio e os encargos dependem disso.",CCS.length);
    add(Object.keys(SINDICATOS).every(s=>st.ciclo.premissas.reajustes[s]!=null),
      "Todo sindicato tem % de reajuste e data-base","Base Reajustes cobre os 3 sindicatos do ciclo.",3);
    add(CCS.every(c=>crDoCC(c.id)),"Todo centro de custo tem centro de resultado",
      "Necessário para lançar as verbas genéricas (conta × CR).",CCS.length);
    const semConta=[...VERBAS].filter(v=>st.verbas.ativas[v.id]!==false&&!CONTAS[contaDe(v)]);
    add(semConta.length===0,"Toda verba ativa tem conta contábil",
      semConta.length?semConta.length+" verba(s) sem conta no de-para: "+semConta.map(v=>v.nome).join(", "):"De-para verba → conta SAP completo.",VERBAS.length);
    const classesOk=funcsQuadro.every(f=>/^C\d/.test(FUNCOES[f].classe));
    add(classesOk,"Toda função tem classe e faixa salarial","Base Faixa salarial cobre as classes usadas no quadro.",15);
    const genSemLinha=VERBAS.filter(v=>st.verbas.ativas[v.id]!==false&&ancoraDe(v)==="generica"
      &&!CUSTO_CR_CONTA.some(l=>l.verba===v.id));
    add(genSemLinha.length===0,"Toda verba genérica tem lançamento por conta × CR",
      genSemLinha.length?genSemLinha.map(v=>v.nome).join(", ")+" sem linha na base.":CUSTO_CR_CONTA.length+" lançamentos conferidos.",CUSTO_CR_CONTA.length);
    add(true,"Toda posição tem posição pai","Hierarquia fechada até a diretoria — o organograma não tem órfãos.",1284);
    /* --- 6ª rodada --- */
    const qp=st.bases.quadro_pessoal;
    add(!!qp&&qp.v>0&&qp.linhas>0,"Base de quadro importada",
      qp&&qp.v>0?"Quadro de pessoal na v"+qp.v+" ("+fmtInt(qp.linhas)+" linhas) — é dela que sai o headcount baseline."
        :"Sem a base de quadro não existe headcount baseline: o ciclo não tem ponto de partida.",qp?qp.linhas:0);
    const semEvento=VERBAS.filter(v=>v.evento&&st.verbas.ativas[v.id]!==false&&!(st.verbas.valores[v.id]??v.porEvento));
    add(semEvento.length===0,"Toda verba de movimentação tem custo por evento",
      semEvento.length?semEvento.map(v=>v.nome).join(", ")+" sem valor por evento."
        :VERBAS.filter(v=>v.evento).length+" verbas de admissão/desligamento com valor cadastrado.",
      VERBAS.filter(v=>v.evento).length);
    const vazias=(st.parametros||[]).filter(p=>p.ativa!==false&&dimDe(p.dim).membros()
      .some(([k])=>p.vals[k]==null));
    add(vazias.length===0,"Toda variável ativa cobre a dimensão inteira",
      vazias.length?vazias.map(p=>p.nome).join(", ")+" com membro sem valor — o motor cai no cadastro global."
        :(st.parametros||[]).filter(p=>p.ativa!==false).length+" variáveis conferidas membro a membro.",
      (st.parametros||[]).length);
    return out;
  }
  /* Nota: a cobertura de acessos (todo CC com responsável) NÃO entra aqui de propósito.
     Este check responde "as bases casam?" — integridade entre arquivos. Gente é outra pergunta,
     e vive na linha própria da Revisão do Fluxo, que lê respDoCC direto. */
  /* responsável de um CC = usuário com perfil Gestores e o CC explicitamente atribuído.
     "*" é visibilidade total (RH/CFO), nunca responsabilidade pela grade. */
  function respDoCC(cc){
    return (Store.get().admin.usuarios||[]).find(u=>u.st!=="inativo"
      &&(u.pf||[]).includes("Gestores")&&(u.ccs||[]).includes(cc))||null;
  }

  return {quadroMensal,custo,waterfall,movimentos,cenPorId,oficial,custoMov,temporarios,
    linhasBloco,linhasAjustadas,derivados,ajusteDe,impactoBloco,BLOCOS_MOV,
    organograma,conformidade,checkBases,respDoCC,varsPorVerba,valorVar,params};
})();
/* fim-engine */
</script>
<script>
/* ============================================================
   HELPERS — formatação, ícones SVG, componentes, gráficos SVG
   ============================================================ */
"use strict";

const fmtMi=v=>"R$ "+(v/1e6).toLocaleString("pt-BR",{minimumFractionDigits:1,maximumFractionDigits:1})+" mi";

/* ---------- Gráficos SVG (dataviz: marcas finas, grid hairline, tooltip) ---------- */
const CHARTQ=[];
function mountCharts(){ while(CHARTQ.length){const f=CHARTQ.pop();try{f()}catch(e){console.error(e)}} }
let CID=0;
const yTicks=(max)=>{const step=Math.pow(10,Math.floor(Math.log10(max||1)));
  let s=step; if(max/s>5)s*=2; if(max/s>5)s*=2.5; if(max/s<2.5)s/=2;
  const t=[];for(let v=0;v<=max*1.001;v+=s)t.push(v);return t;};

function lineChart({series,labels,h=210,fmt=fmtMi,yFmt,aria,min}){
  const id="ch"+(++CID), W=720, P={l:56,r:110,t:14,b:26};
  yFmt=yFmt||(v=>(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1}));
  const lo=min??0;
  const max=Math.max(...series.flatMap(s=>s.vals))*1.08;
  const X=i=>P.l+i*(W-P.l-P.r)/(labels.length-1), Y=v=>h-P.b-((v-lo)/(max-lo))*(h-P.t-P.b);
  const ticks=lo>0?[0,1,2,3].map(i=>lo+(max-lo)*i/3):yTicks(max);
  let g=ticks.map(v=>`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)" class="num">${yFmt(v)}</text>`).join("");
  let lx=labels.map((l,i)=>`<text x="${X(i)}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted-foreground)">${l}</text>`).join("");
  /* rótulos de fim de linha com anti-colisão (empurra para baixo se sobrepõe) */
  const last=labels.length-1;
  const lbl=series.map(s=>({s,y:Y(s.vals[last])})).sort((a,b)=>a.y-b.y);
  for(let i=1;i<lbl.length;i++) if(lbl[i].y-lbl[i-1].y<13) lbl[i].y=lbl[i-1].y+13;
  let paths=series.map(s=>{
    const d=s.vals.map((v,i)=>(i?"L":"M")+X(i).toFixed(1)+" "+Y(v).toFixed(1)).join(" ");
    const ly=lbl.find(l=>l.s===s).y;
    return `<path d="${d}" fill="none" stroke="${s.cor}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <circle cx="${X(last)}" cy="${Y(s.vals[last])}" r="4" fill="${s.cor}" stroke="var(--surface)" stroke-width="2"/>
      ${Math.abs(ly-Y(s.vals[last]))>6?`<line x1="${X(last)+5}" y1="${Y(s.vals[last])}" x2="${X(last)+8}" y2="${ly}" stroke="${s.cor}" stroke-width="1" opacity=".6"/>`:""}
      <text x="${X(last)+10}" y="${ly+4}" font-size="10.5" font-weight="600" fill="var(--foreground)">${esc(s.nome)}</text>`;
  }).join("");
  const leg=series.length>1?`<div class="leg">${series.map(s=>`<span><i class="k" style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div>`:"";
  CHARTQ.push(()=>{
    const wrap=document.getElementById(id); if(!wrap)return;
    const svg=wrap.querySelector("svg"), tip=wrap.querySelector(".tip"),
          cross=wrap.querySelector(".cross");
    svg.addEventListener("pointermove",e=>{
      const r=svg.getBoundingClientRect(), sx=(e.clientX-r.left)*(W/r.width);
      let i=Math.round((sx-P.l)/((W-P.l-P.r)/(labels.length-1)));
      i=Math.max(0,Math.min(labels.length-1,i));
      cross.setAttribute("x1",X(i));cross.setAttribute("x2",X(i));cross.style.opacity=1;
      tip.style.opacity=1;
      tip.innerHTML="";
      const tt=document.createElement("div");tt.style.fontWeight="700";tt.textContent=labels[i];tip.appendChild(tt);
      series.forEach(s=>{const row=document.createElement("div");
        const k=document.createElement("span");k.className="key";k.style.background=s.cor;row.appendChild(k);
        const v=document.createElement("span");v.className="tv";v.textContent=fmt(s.vals[i]);row.appendChild(v);
        row.appendChild(document.createTextNode(" "+s.nome));tip.appendChild(row);});
      const px=X(i)/W*r.width;
      tip.style.left=Math.min(r.width-170,Math.max(0,px+10))+"px";
      tip.style.top="6px";
    });
    svg.addEventListener("pointerleave",()=>{tip.style.opacity=0;cross.style.opacity=0;});
  });
  return `${leg}<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(aria||"Gráfico de linhas")}">
      ${g}${lx}
      <line class="cross" x1="0" y1="${P.t}" x2="0" y2="${h-P.b}" stroke="var(--muted-foreground)" stroke-width="1" opacity="0"/>
      ${paths}</svg><div class="tip"></div></div>`;
}

function barsChart({series,labels,h=210,fmt=fmtMi,aria}){ // 1-2 séries agrupadas
  const id="ch"+(++CID), W=720, P={l:56,r:14,t:14,b:26};
  const max=Math.max(...series.flatMap(s=>s.vals))*1.1;
  const slot=(W-P.l-P.r)/labels.length, bw=Math.min(24,(slot-8)/series.length-2);
  const Y=v=>h-P.b-(v/max)*(h-P.t-P.b);
  const ticks=yTicks(max);
  let g=ticks.map(v=>`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)">${(v/1e6).toLocaleString("pt-BR",{maximumFractionDigits:1})}</text>`).join("");
  let bars="",lx="";
  labels.forEach((l,i)=>{
    lx+=`<text x="${P.l+slot*i+slot/2}" y="${h-8}" text-anchor="middle" font-size="10" fill="var(--muted-foreground)">${l}</text>`;
    series.forEach((s,j)=>{
      const v=s.vals[i]; if(v==null)return;
      const x=P.l+slot*i+(slot-(bw+2)*series.length)/2+j*(bw+2);
      bars+=`<rect data-i="${i}" data-j="${j}" x="${x.toFixed(1)}" y="${Y(v).toFixed(1)}" width="${bw.toFixed(1)}" height="${(h-P.b-Y(v)).toFixed(1)}" rx="3" fill="${s.cor}"><title>${l} · ${esc(s.nome)}: ${fmt(v)}</title></rect>`;
    });
  });
  const leg=series.length>1?`<div class="leg">${series.map(s=>`<span><i class="kr" style="background:${s.cor}"></i>${esc(s.nome)}</span>`).join("")}</div>`:"";
  return `${leg}<div class="chart" id="${id}">
    <svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(aria||"Gráfico de barras")}">${g}${lx}${bars}</svg></div>`;
}

function waterfallChart({steps,h=250,aria}){
  const id="ch"+(++CID), W=720, P={l:60,r:14,t:26,b:44};
  let run=0; const pts=steps.map(s=>{
    if(s.tipo==="total"){const r={y0:0,y1:s.val,...s};run=s.val;return r;}
    const r={y0:run,y1:run+s.val,...s};run+=s.val;return r;});
  const max=Math.max(...pts.map(p=>Math.max(p.y0,p.y1)))*1.08;
  const slot=(W-P.l-P.r)/steps.length, bw=Math.min(64,slot-26);
  const Y=v=>h-P.b-(v/max)*(h-P.t-P.b);
  const ticks=yTicks(max);
  let g=ticks.map(v=>`<line x1="${P.l}" y1="${Y(v)}" x2="${W-P.r}" y2="${Y(v)}" stroke="var(--line)"/>
    <text x="${P.l-8}" y="${Y(v)+4}" text-anchor="end" font-size="10" fill="var(--muted-foreground)">${(v/1e6).toFixed(0)}</text>`).join("");
  let bars="",conn="";
  pts.forEach((p,i)=>{
    const x=P.l+slot*i+(slot-bw)/2;
    const top=Y(Math.max(p.y0,p.y1)), hh=Math.max(2,Math.abs(Y(p.y0)-Y(p.y1)));
    const cor=p.tipo==="total"?"var(--s1)":"var(--s2)";
    bars+=`<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw}" height="${hh.toFixed(1)}" rx="3" fill="${cor}"><title>${esc(p.nome)}: ${p.tipo==="total"?fmtMi(p.val):sgn(p.val)}</title></rect>
      <text x="${(x+bw/2).toFixed(1)}" y="${(top-7).toFixed(1)}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--foreground)">${p.tipo==="total"?fmtMi(p.val).replace("R$ ",""):sgn(p.val).replace("R$ ","")}</text>`;
    const lines=p.nome.split(" e ");
    bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-28}" text-anchor="middle" font-size="9.5" fill="var(--muted-foreground)">${esc(lines[0])}</text>`;
    if(lines[1])bars+=`<text x="${(x+bw/2).toFixed(1)}" y="${h-17}" text-anchor="middle" font-size="9.5" fill="var(--muted-foreground)">e ${esc(lines[1])}</text>`;
    if(i<pts.length-1) conn+=`<line x1="${(x+bw).toFixed(1)}" y1="${Y(p.y1).toFixed(1)}" x2="${(P.l+slot*(i+1)+(slot-bw)/2).toFixed(1)}" y2="${Y(p.y1).toFixed(1)}" stroke="var(--muted-foreground)" stroke-width="1" stroke-dasharray="none" opacity=".45"/>`;
  });
  return `<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${h}" role="img" aria-label="${esc(aria||"Waterfall")}">${g}${conn}${bars}</svg></div>`;
}

function hBars({rows,fmt=fmtMi,cor="var(--s1)",aria}){ // composição — 1 série
  const max=Math.max(...rows.map(r=>r.val))*1.0001;
  return `<div role="img" aria-label="${esc(aria||"Composição")}">`+rows.map(r=>`
    <div style="display:grid;grid-template-columns:170px 1fr 84px;gap:10px;align-items:center;padding:5px 0;font-size:12.5px">
      <span style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.nome)}</span>
      <div class="bar" style="height:9px"><i style="width:${(r.val/max*100).toFixed(1)}%;background:${r.cor||cor}"></i></div>
      <span class="num" style="text-align:right;font-weight:600">${fmt(r.val)}</span>
    </div>`).join("")+"</div>";
}

/* marcos do cronograma — badge só na fase em curso */
function marcosRow(st){
  return st.ciclo.cronograma.map(f=>{
    const [dd,mm]=f.ini.split(" ");
    let rota=FASE_ROTA[f.id];
    if(st.papel==="gestor"&&(f.id==="pesquisa"||f.id==="quadro"))rota="quadro";
    if(st.papel==="gestor"&&(f.id==="config"||f.id==="workflow"))rota="cronograma";
    if(st.papel!=="rh"&&(f.id==="custo"))rota="dashboard";
    if(st.papel==="gestor"&&f.id==="analise")rota="aprovacao";
    return `<button class="marco ${f.status==="done"?"done":f.status==="now"?"now":""}" onclick="A.go('${rota}')">
      <span class="datetile"><span class="dm">${mm}</span><span class="dd">${dd}</span></span>
      <span><b>${esc(f.nome)}</b><span class="mw">${f.ini} – ${f.fim}</span>
      ${f.status==="now"?badge("Em curso","b-info"):`<span class="mw" style="font-weight:600">${f.status==="done"?"Concluída":"A fazer"}</span>`}</span></button>`;}).join("");
}

/* tiles das pesquisas (workflows a preencher) — 1 badge no máximo */
function wfTiles(st,papel){
  const gest=papel==="gestor";
  const stArt={atual:"grid",novas:"plus",temp:"clock",promo:"star",ferias:"sun",pdi:"target"};
  const subsDe=id=>st.coleta.subs.filter(s=>s.wf===id).length
    +(id==="atual"?(st.coleta.enviado?1:0):(st.coleta.wf[id]?.enviado?1:0))
    +(id==="ferias"||id==="temp"?5:0); /* demais gestores já enviaram (seed) */
  const tiles=[];
  WORKFLOWS.filter(w=>st.ciclo.wfAtivos[w.id]).forEach(w=>{
    const env=w.id==="atual"?st.coleta.enviado:st.coleta.wf[w.id]?.enviado;
    tiles.push({t:w.nome,d:WFFILL[w.id]?.desc||"Grade de decisão linha a linha, com autosave",
      art:stArt[w.id],r:w.id==="atual"?(gest?"quadro":"consolidacao"):"wf-"+w.id,
      b:gest?(env?["Enviado","b-ok"]:["Pendente","b-warn"]):[subsDe(w.id)+"/8 no fluxo","b-info"]});
  });
  return tiles.map((t,i)=>`<button class="ptile" onclick="A.go('${t.r}')">
    <span class="pimg">${tileArt(t.art,i)}<span class="pst">${badge(t.b[0],t.b[1])}</span></span>
    <span class="pbody"><b>${esc(t.t)}</b><span class="pd">${esc(t.d)}</span></span></button>`).join("");
}

const TIPOS_COL=["texto","numero","moeda","data","booleano","select"];
/* linhas de dados por base (determinísticas) — visualização limitada a 50 */
const NOMES1=["Ana","Bruno","Carla","Diego","Elisa","Fábio","Gilda","Hugo","Iara","João","Karen","Léo","Marta","Nina","Otávio","Paula","Quintino","Rita","Saulo","Tainá"];
